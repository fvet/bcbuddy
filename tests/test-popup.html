<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>BCBuddy popup harness</title>
<style>#results { white-space: pre-wrap; font-family: monospace; padding: 12px; }</style>
</head>
<body>
<div id="results">running...</div>
<div id="app"></div>

<script>
var ROOT = '../';
var STORE = {
  settings: {
    enabled: true,
    // Same id as the shared rule below: that happens when you import the
    // shared file and then edit the rule locally.
    rules: [
      { id: 'gedeeld-prod', name: 'PROD', color: '#c4314b',
        conditions: [{ field: 'environment', op: 'equals', value: 'Productie' }] }
    ],
    hosted: {
      url: 'https://raw.githubusercontent.com/x/y/main/bc.json',
      rules: [
        { id: 'gedeeld-prod', name: 'PROD GEDEELD', color: '#0f6cbd',
          conditions: [{ field: 'environment', op: 'equals', value: 'Productie' }] }
      ]
    }
  }
};
var OPENED = 0;
var POPUP_BODY = '';
var TAB_URL = 'https://businesscentral.dynamics.com/453d817a-d5b1-49c1-bdcf-d9474180a702/' +
  'Productie?company=CONTOSO%20BE&page=21';

/*
 * chrome.i18n with the real messages from _locales/nl. Loaded synchronously
 * so the scripts below can use them immediately.
 */
var MESSAGES = (function () {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../_locales/nl/messages.json', false);
    xhr.send();
    return JSON.parse(xhr.responseText);
  } catch (e) {
    return {};
  }
})();

function i18nStub() {
  return {
    getUILanguage: function () { return 'nl'; },
    getMessage: function (key, subs) {
      var entry = MESSAGES[key];
      if (!entry) return '';
      var message = entry.message;
      (subs || []).forEach(function (value, index) {
        message = message.split('$' + (index + 1)).join(value);
      });
      return message;
    }
  };
}
window.chrome = {
  i18n: i18nStub(),
  storage: {
    local: {
      get: function (keys) {
        var out = {};
        (typeof keys === 'string' ? [keys] : keys).forEach(function (k) {
          if (STORE[k] !== undefined) out[k] = STORE[k];
        });
        return Promise.resolve(out);
      },
      set: function (obj) { Object.keys(obj).forEach(function (k) { STORE[k] = obj[k]; }); return Promise.resolve(); },
      remove: function (k) { delete STORE[k]; return Promise.resolve(); }
    },
    onChanged: { addListener: function () {} }
  },
  runtime: {
    sendMessage: function () { return Promise.resolve({ ok: true, count: 2 }); },
    openOptionsPage: function () { OPENED++; }
  },
  tabs: {
    query: function () { return Promise.resolve([{ id: 1, url: TAB_URL }]); }
  }
};
window.close = function () {};

var results = [];
function check(name, actual, expected) {
  var ok = JSON.stringify(actual) === JSON.stringify(expected);
  results.push((ok ? 'PASS  ' : 'FAIL  ') + name +
    (ok ? '' : '\n        expected: ' + JSON.stringify(expected) + '\n        got: ' + JSON.stringify(actual)));
}
function truthy(name, actual) {
  results.push((actual ? 'PASS  ' : 'FAIL  ') + name + (actual ? '' : '  (got: ' + JSON.stringify(actual) + ')'));
}
function cssRule(selector) {
  var found = null;
  Array.prototype.forEach.call(document.styleSheets, function (sheet) {
    var rules;
    try { rules = sheet.cssRules; } catch (e) { return; }
    Array.prototype.forEach.call(rules || [], function (rule) {
      if (rule.selectorText === selector) found = rule;
    });
  });
  return found;
}

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src; s.onload = resolve;
    s.onerror = function () { reject(new Error('kon ' + src + ' niet laden')); };
    document.head.appendChild(s);
  });
}

fetch(ROOT + 'src/popup/popup.html')
  .then(function (r) { return r.text(); })
  .then(function (html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
    POPUP_BODY = doc.body.innerHTML;
    document.getElementById('app').innerHTML = POPUP_BODY;
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = ROOT + 'src/popup/popup.css';
    document.head.appendChild(css);
    return loadScript(ROOT + 'src/lib/i18n.js')
        .then(function () { return loadScript(ROOT + 'src/lib/match.js'); })
      .then(function () { return loadScript(ROOT + 'src/lib/settings.js'); })
      .then(function () { return loadScript(ROOT + 'src/popup/popup.js'); });
  })
  .then(function () { return new Promise(function (r) { setTimeout(r, 400); }); })
  .then(function () {
    check('popup: brand name at top',
      document.querySelector('header .brand-name').textContent, 'BC Buddy');
    check('popup: document lang follows UI language',
      document.documentElement.lang, 'nl');
    truthy('popup: logo beside brand name', !!document.querySelector('header svg.brand'));
    check('popup: brand dot uses rule color',
      document.getElementById('brandDot').style.fill, 'rgb(196, 49, 75)');

    check('popup: active rule shown',
      document.querySelector('#parsed div:first-child dd').textContent, 'PROD');
    check('popup: local rule with same id as shared stays local',
      document.querySelector('#parsed div:first-child dd').title, 'PROD — eigen regel');
    truthy('popup: company from URL', document.getElementById('parsed').textContent.indexOf('CONTOSO BE') !== -1);
    truthy('popup: environment from URL', document.getElementById('parsed').textContent.indexOf('Productie') !== -1);
    check('popup: rule precedes URL fields, tenant omitted',
      Array.prototype.map.call(document.querySelectorAll('#parsed dt'), function (dt) { return dt.textContent; }),
      ['Regel', 'Omgeving', 'Bedrijf']);
    truthy('popup: tenant is not shown',
      document.getElementById('parsed').textContent.indexOf('453d817a') === -1);
    truthy('popup: toggle is on', document.getElementById('enabled').checked);
    check('popup: add rule button label',
      document.getElementById('addRule').textContent, 'Regel toevoegen');
    truthy('popup: no button when a rule already matches',
      document.getElementById('addRule').offsetParent === null);
    truthy('popup: sync visible with shared URL',
      document.getElementById('syncNow').offsetParent !== null);

    // .btn:hover sets a grey background; the primary button must override that,
    // otherwise you get dark text on a dark button.
    check('popup: follows system theme without toggle',
      getComputedStyle(document.documentElement).colorScheme, 'light dark');

    var hover = cssRule('.btn--primary:hover');
    truthy('popup: primary button has its own hover rule', !!hover);
    if (hover) {
      truthy('popup: hover sets its own background',
        !!(hover.style.background || hover.style.backgroundColor));
      truthy('popup: hover sets its own text color', !!hover.style.color);
    }

    document.getElementById('enabled').checked = false;
    document.getElementById('enabled').dispatchEvent(new Event('change'));
    return new Promise(function (r) { setTimeout(r, 200); });
  })
  .then(function () {
    check('popup: disabled state persisted', STORE.settings.enabled, false);

    // rebuild for a tab that is not Business Central
    STORE.settings.enabled = true;
    TAB_URL = 'https://www.google.com/shopping';
    document.getElementById('app').innerHTML = POPUP_BODY;
    return loadScript(ROOT + 'src/popup/popup.js?herlaad');
  })
  .then(function () { return new Promise(function (r) { setTimeout(r, 300); }); })
  .then(function () {
    check('popup: only the found fields',
      Array.prototype.map.call(document.querySelectorAll('#parsed dt'), function (dt) { return dt.textContent; }),
      ['Regel', 'Omgeving']);
    check('popup: corresponding values',
      Array.prototype.map.call(document.querySelectorAll('#parsed dd'), function (dd) { return dd.textContent; }),
      ['Geen Business Central', 'shopping']);

    // Without a matching rule the button is shown, and it prepares a draft.
    truthy('popup: button shown when no rule matches',
      document.getElementById('addRule').offsetParent !== null);
    document.getElementById('addRule').click();
    return new Promise(function (r) { setTimeout(r, 200); });
  })
  .then(function () {
    truthy('popup: draft rule prepared', !!STORE.pendingRule);
    if (STORE.pendingRule) {
      check('popup: name from environment', STORE.pendingRule.name, 'SHOPPING');
      check('popup: outside BC, condition on full URL',
        STORE.pendingRule.conditions,
        [{ field: 'url', op: 'contains', value: 'https://www.google.com/shopping' }]);
      truthy('popup: color included in draft', !!STORE.pendingRule.color);
    }
    truthy('popup: options page opened', OPENED === 1);

    // Without a shared URL the Sync button has nothing useful to do.
    STORE.settings.hosted.url = '';
    document.getElementById('app').innerHTML = POPUP_BODY;
    return loadScript(ROOT + 'src/popup/popup.js?zonder-url');
  })
  .then(function () { return new Promise(function (r) { setTimeout(r, 300); }); })
  .then(function () {
    truthy('popup: sync hidden without shared URL',
      document.getElementById('syncNow').offsetParent === null);

    STORE.settings.hosted.url = 'http://example.com/bc.json';
    document.getElementById('app').innerHTML = POPUP_BODY;
    return loadScript(ROOT + 'src/popup/popup.js?http-url');
  })
  .then(function () { return new Promise(function (r) { setTimeout(r, 300); }); })
  .then(function () {
    truthy('popup: sync hidden for http URL',
      document.getElementById('syncNow').offsetParent === null);
  })
  .catch(function (err) { results.push('FAIL  harness: ' + err.message); })
  .then(function () {
    var failed = results.filter(function (l) { return l.indexOf('FAIL') === 0; });
    document.getElementById('results').textContent =
      results.join('\n') + '\n\nTOTAL: ' + results.length + ' checks, ' + failed.length + ' failed.';
  });
</script>
</body>
</html>
