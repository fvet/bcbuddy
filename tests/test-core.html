  #fakeHeader { position: fixed; top: 0; left: 0; width: 100%; height: 40px; background: #1f1f1f; color: #fff; display: flex; align-items: center; gap: 20px; padding: 0 12px; box-sizing: border-box; }
  #results { margin-top: 60px; padding: 12px; white-space: pre-wrap; }
  .hdr-icons { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .hdr-btn { background: #2b2b2b; color: #fff; border: 0; padding: 4px 8px; }

    <div class="hdr-inner">
      <a href="#"><span class="brand-text">Dynamics 365 Business Central</span></a>
    </div>
    <span class="env-chip">Environment: Sandbox</span>
    <!-- Icons on the right, as BC renders them: buttons with their own dark
         background, a search field, and an avatar with an image. -->

      <button type="button" class="hdr-btn">?</button>
      <button type="button" class="hdr-btn" style="background-color: #2b2b2b !important">!</button>
      <input type="text" class="hdr-search" value="zoek">
      <span class="hdr-avatar"></span>
    </span>
  </div>
  <div id="results">running...</div>

<script>
/* ---- chrome API stub ---------------------------------------------------- */
var STORE = {};
var LISTENERS = [];
/*
 * chrome.i18n with the real messages from _locales/en (the default locale). Loaded synchronously
 * so the scripts below can use them immediately.
 */
var MESSAGES = (function () {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../_locales/en/messages.json', false);
    xhr.send();
    return JSON.parse(xhr.responseText);
  } catch (e) {
    return {};
  }
})();

function i18nStub() {
  return {
    getUILanguage: function () { return 'en'; },
    getMessage: function (key, subs) {
      var entry = MESSAGES[key];
      if (!entry) return '';
      var message = entry.message;
      (subs || []).forEach(function (value, index) {
        message = message.split('$' + (index + 1)).join(value);
      });
      return message;
    }
  };
}
window.chrome = {
  i18n: i18nStub(),
  storage: {
    local: {
      get: function (keys) {
        var out = {};
        (typeof keys === 'string' ? [keys] : keys).forEach(function (k) {
          if (STORE[k] !== undefined) out[k] = STORE[k];
        });
        return Promise.resolve(out);
      },
      // Like Chrome, a write tells every listener, so the content script picks
      // up new settings while the page stays open.
      set: function (obj) {
        var changes = {};
        Object.keys(obj).forEach(function (k) {
          changes[k] = { oldValue: STORE[k], newValue: obj[k] };
          STORE[k] = obj[k];
        });
        LISTENERS.forEach(function (fn) { fn(changes, 'local'); });
        return Promise.resolve();
      },
      remove: function () { return Promise.resolve(); }
    },
    onChanged: { addListener: function (fn) { LISTENERS.push(fn); } }
  },
  runtime: { sendMessage: function () { return Promise.resolve({}); }, onMessage: { addListener: function () {} } }
};
</script>

<script>
/* ---- seed settings for the content script ------------------------------- */
var BCBuddy = window.BCBuddy;
/*
 * Display lives in a style here, and the rule deliberately has different own
 * settings beside it. Everything the content script draws below therefore
 * demonstrably comes from the style.
 */
STORE[BCBuddy.STORAGE_KEY] = BCBuddy.normalize({
  enabled: true,
  styles: [BCBuddy.normalizeStyle({
    id: 'lay-core',
    name: 'Harness',
    ribbon: { enabled: true, text: 'Dynamics 365 Business Central - GEMARKEERD ({name})' },
    border: { enabled: true, width: 5 },
    banner: { enabled: true, position: 'top-right', text: '{name}' },
    title: { enabled: true, text: '[{name}] {title}' },
    favicon: { enabled: true }
  })],
  rules: [BCBuddy.normalizeRule({
    name: 'HARNESS',
    color: '#006600',
    styleId: 'lay-core',
    conditions: [{ field: 'url', op: 'contains', value: 'test-core' }],
    favicon: { text: 'HA' }
  })]
});
</script>

<script src="../src/content/content.js"></script>
<script src="../src/content/calm.js"></script>

<script>
(function () {
  var results = [];
  function check(name, actual, expected) {
    var ok = JSON.stringify(actual) === JSON.stringify(expected);
    results.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok ? '' : '\n        expected: ' + JSON.stringify(expected) + '\n        got: ' + JSON.stringify(actual)));
  }
  function truthy(name, actual) {
    results.push((actual ? 'PASS  ' : 'FAIL  ') + name + (actual ? '' : '  (got: ' + JSON.stringify(actual) + ')'));
  }

  var SAAS = 'https://businesscentral.dynamics.com/c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811/Sandbox?company=CRONUS%20BE&page=1&dc=0&bookmark=B_TwAAAAJ7';
  var ONPREM = 'https://bc-server.local:8080/BC240/?company=CRONUS%20Belgium&tenant=default';

  var saas = BCBuddy.parseUrl(SAAS);
  check('parseUrl SaaS: environment', saas.environment, 'Sandbox');
  check('parseUrl SaaS: company', saas.company, 'CRONUS BE');
  check('parseUrl SaaS: tenant', saas.tenant, 'c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811');
  check('parseUrl SaaS: host', saas.host, 'businesscentral.dynamics.com');
  check('parseUrl SaaS: isbc', saas.isbc, true);
  check('parseUrl SaaS: url decoded', saas.url.indexOf('CRONUS BE') !== -1, true);

  var onprem = BCBuddy.parseUrl(ONPREM);
  check('parseUrl onprem: server instance as environment', onprem.environment, 'BC240');
  check('parseUrl onprem: tenant from query', onprem.tenant, 'default');
  check('parseUrl onprem: company', onprem.company, 'CRONUS Belgium');
  check('parseUrl onprem: isbc', onprem.isbc, false);

  /*
   * Shapes from Microsoft's documentation:
   * https://<host>[/<aadtenantid>][/<environmentname>]/?[company=..]&[tenant=..]
   * Tenant and environment are both optional, and the tenant can be a GUID or a
   * domain name. On-prem puts the server instance where the environment would be,
   * and the tenant comes from the query.
   */
  function velden(url) {
    var c = BCBuddy.parseUrl(url);
    return [c.tenant, c.environment, c.company];
  }
  check('URL: without tenant and without environment',
    velden('https://businesscentral.dynamics.com/?company=CRONUS%20International%20Ltd.&page=9305'),
    ['', 'Production', 'CRONUS International Ltd.']);
  check('URL: environment without tenant',
    velden('https://businesscentral.dynamics.com/Production/?company=CRONUS%20BE'),
    ['', 'Production', 'CRONUS BE']);
  check('URL: tenant as GUID without environment',
    velden('https://businesscentral.dynamics.com/c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811/?company=CRONUS%20BE'),
    ['c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811', 'Production', 'CRONUS BE']);
  check('URL: tenant as domain name alone opens the default, Production',
    velden('https://businesscentral.dynamics.com/contoso.com'), ['contoso.com', 'Production', '']);
  check('URL: a deep link without environment opens Production too',
    velden('https://businesscentral.dynamics.com/contoso.com/deeplink?company=CRONUS'),
    ['contoso.com', 'Production', 'CRONUS']);
  check('URL: an empty path elsewhere is no environment',
    [BCBuddy.parseUrl('https://example.com/').environment,
      BCBuddy.parseUrl('https://example.com/?company=CRONUS').environment,
      BCBuddy.parseUrl('https://contoso.bc.dynamics.com/').environment], ['', '', '']);
  check('URL: tenant as domain name with environment',
    velden('https://businesscentral.dynamics.com/contoso.onmicrosoft.com/Sandbox/?company=CRONUS%20BE'),
    ['contoso.onmicrosoft.com', 'Sandbox', 'CRONUS BE']);
  check('URL: on-prem with tenant in query',
    velden('https://bc.contoso.local:8080/BC240/?company=CRONUS%20BE&tenant=default'),
    ['default', 'BC240', 'CRONUS BE']);
  check('URL: on-prem without tenant',
    velden('https://localhost:8080/BC/?company=CRONUS'), ['', 'BC', 'CRONUS']);
  check('URL: on-prem without https',
    velden('http://bcserver/BC240/?company=CRONUS%20Belgium&page=21'), ['', 'BC240', 'CRONUS Belgium']);

  // Company names hold more than letters and spaces. The query is decoded once:
  // a second pass turned R%2BD into "R D" and a literal %20 into a space.
  var PROD_URL = 'https://businesscentral.dynamics.com/Production/?company=';
  check('URL: a + in the company name stays a +',
    velden(PROD_URL + 'R%2BD%20Solutions')[2], 'R+D Solutions');
  check('URL: a + written for a space still reads as a space',
    velden(PROD_URL + 'CRONUS+BE')[2], 'CRONUS BE');
  check('URL: & and accents in the company name',
    velden(PROD_URL + 'Fa%C3%A7ade%20%26%20Co%27s')[2], 'Façade & Co\'s');
  check('URL: a percent sign in the company name',
    velden(PROD_URL + '100%25%20Bio')[2], '100% Bio');
  check('URL: an encoded %20 in the company name is not decoded twice',
    velden(PROD_URL + '50%2520off')[2], '50%20off');
  check('URL: an emoji in the company name',
    velden(PROD_URL + '%F0%9F%8D%95%20Pizza')[2], '🍕 Pizza');
  check('URL: a + in the tenant from the query stays a +',
    velden('https://bc.contoso.local/BC240/?tenant=a%2Bb')[0], 'a+b');
  check('match: Company equals a name with a +',
    BCBuddy.matchRule({ conditions: [{ field: 'company', op: 'equals', value: 'R+D Solutions' }] },
      BCBuddy.parseUrl(PROD_URL + 'R%2BD%20Solutions')), true);

  // Web client tweaks: BC only. The rest of Dynamics 365 lives on dynamics.com too.
  [
    ['https://businesscentral.dynamics.com/contoso.com/Production', true],
    [SAAS, true],
    ['https://businesscentral.dynamics-tie.com/c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811/', true],
    ['https://contoso.bc.dynamics.com/', true],
    [ONPREM, true],
    ['http://bcserver/BC240/?company=CRONUS', true],
    ['https://erp.contoso.local/BC240/', true],
    ['https://contoso.crm4.dynamics.com/main.aspx?appid=1', false],
    ['https://bcorp.crm.dynamics.com/main.aspx', false],
    ['https://contoso.operations.dynamics.com/', false],
    ['https://home.dynamics.com/', false],
    ['https://make.powerapps.com/', false],
    ['https://evil-businesscentral.dynamics.com.example.net/', false],
    ['niet-een-url', false]
  ].forEach(function (c) {
    check('web client target: ' + c[0], BCBuddy.isWebClientTarget(c[0]), c[1]);
  });

  check('parseUrl: garbage yields empty context', BCBuddy.parseUrl('niet-een-url').host, '');
  check('parseUrl: no page field anymore',
    Object.prototype.hasOwnProperty.call(saas, 'page'), false);
  check('operators: RegEx is last',
    BCBuddy.OPERATORS.map(function (o) { return o.value; }),
    ['contains', 'equals', 'startsWith', 'endsWith', 'notContains', 'regex']);
  check('fields: page is no longer a choice',
    BCBuddy.FIELDS.map(function (f) { return f.value; }),
    ['environment', 'company', 'tenant', 'url']);
  check('template: {page} is no longer a token',
    BCBuddy.render('{page}', saas, {}), '{page}');

  // matching
  var r = function (conds) { return BCBuddy.normalizeRule({ name: 'x', conditions: conds }); };
  check('match: value somewhere in URL', BCBuddy.matchRule(r([{ field: 'url', op: 'contains', value: 'Sandbox' }]), saas), true);
  check('match: company with space', BCBuddy.matchRule(r([{ field: 'company', op: 'equals', value: 'cronus be' }]), saas), true);
  check('match: AND, both true', BCBuddy.matchRule(r([
    { field: 'environment', op: 'contains', value: 'sand' },
    { field: 'company', op: 'contains', value: 'CRONUS' }]), saas), true);
  check('match: AND, one false', BCBuddy.matchRule(r([
    { field: 'environment', op: 'contains', value: 'sand' },
    { field: 'company', op: 'contains', value: 'CONTOSO' }]), saas), false);
  check('match: regex', BCBuddy.matchRule(r([{ field: 'environment', op: 'regex', value: '^sand(box)?$' }]), saas), true);
  check('match: invalid regex fails without crash', BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '[' }]), saas), false);
  check('match: nested quantifiers fail closed',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '(a+)+' }]), saas), false);
  check('match: quantified alternation fails closed',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '(a|a)+' }]), saas), false);
  check('match: plain quantified group still allowed',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '(sand)+box' }]), saas), true);
  check('match: pipe in a character class is not alternation',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '[a|s]+andbox' }]), saas), true);
  check('match: oversized regex fails closed',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: new Array(202).join('a') }]), saas), false);
  check('match: oversized subject fails closed',
    BCBuddy.testCondition({ field: 'url', op: 'regex', value: 'a' },
      { url: new Array(2050).join('a') }), false);

  // Ungrouped quantifiers: each one multiplies the work, and these froze a tab
  // for seconds to minutes before the budget in match.js.
  var longUrl = (saas.url + '&filter=' + new Array(400).join('x/y-z')).slice(0, 2000);
  var started = Date.now();
  check('regex: chained optionals are refused',
    BCBuddy.safeRegexTest('.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?.?Q', longUrl), false);
  check('regex: chained ranges are refused',
    BCBuddy.safeRegexTest('.{0,10}.{0,10}.{0,10}.{0,10}.{0,10}.{0,10}Q', longUrl), false);
  check('regex: two open quantifiers on a long URL are refused',
    BCBuddy.safeRegexTest('/.*.*Q', longUrl), false);
  check('regex: a heavy branch after | is refused',
    BCBuddy.safeRegexTest('^a|x.*.*.*Q', longUrl), false);
  check('regex: leading .* chain costs nothing',
    BCBuddy.safeRegexTest('.*.*.*.*.*.*Q', longUrl), false);
  truthy('regex: refusing is instant', Date.now() - started < 200);
  check('regex: problem for a heavy pattern', BCBuddy.regexProblem('/.*.*Q', longUrl.length), 'heavy');
  check('regex: problem for nested quantifiers', BCBuddy.regexProblem('(a+)+', 5), 'heavy');
  check('regex: problem for a syntax error', BCBuddy.regexProblem('[', 5), 'invalid');
  check('regex: no problem for a plain pattern', BCBuddy.regexProblem('^sand(box)?$', 7), '');

  // what people write still works, on a long URL too
  var longSaas = { url: longUrl };
  [
    '.*Sandbox.*',
    '.*Sandbox.*CRONUS.*',
    '^https://.*/Sandbox',
    '^https?://[^/]+/[^/]+/Sandbox',
    'businesscentral\\.dynamics\\.com/.*/Sandbox'
  ].forEach(function (pattern) {
    check('regex: still matches ' + pattern,
      BCBuddy.testCondition({ field: 'url', op: 'regex', value: pattern }, longSaas), true);
  });
  check('regex: an escaped .* at the end is kept',
    BCBuddy.safeRegexTest('Sandbox\\.*$', 'Sandbox...'), true);
  check('regex: and still has to match',
    BCBuddy.safeRegexTest('Sandbox\\.*$', 'Sandbox!'), false);
  check('regex: a lone .* matches anything', BCBuddy.safeRegexTest('.*', 'x'), true);
  check('match: not contains', BCBuddy.matchRule(r([{ field: 'environment', op: 'notContains', value: 'prod' }]), saas), true);
  check('match: contains a list', BCBuddy.testCondition({ field: 'environment', op: 'contains', value: 'dev,uat,sand' }, saas), true);
  check('match: contains a list, spaces and case', BCBuddy.testCondition({ field: 'environment', op: 'contains', value: ' DEV , SANDBOX ' }, saas), true);
  check('match: contains a list, none listed', BCBuddy.testCondition({ field: 'environment', op: 'contains', value: 'dev, uat, qa' }, saas), false);
  check('match: only commas never matches', BCBuddy.testCondition({ field: 'environment', op: 'contains', value: ' , ,' }, saas), false);
  check('match: does not contain a list', BCBuddy.testCondition({ field: 'environment', op: 'notContains', value: 'prod, production' }, saas), true);
  check('match: does not contain a list, one listed', BCBuddy.testCondition({ field: 'environment', op: 'notContains', value: 'prod, sandbox' }, saas), false);
  check('match: does not contain only commas never matches', BCBuddy.testCondition({ field: 'environment', op: 'notContains', value: ',' }, saas), false);
  check('match: equals takes no list', BCBuddy.testCondition({ field: 'environment', op: 'equals', value: 'dev, sandbox' }, saas), false);
  check('match: empty value never matches', BCBuddy.matchRule(r([{ field: 'url', op: 'contains', value: '' }]), saas), false);
  check('match: disabled rule', BCBuddy.matchRule(BCBuddy.normalizeRule({ enabled: false, conditions: [{ field: 'url', op: 'contains', value: 'Sandbox' }] }), saas), false);

  // draft for a new rule, derived from a URL
  var bcDraft = BCBuddy.draftFromContext(saas);
  check('new rule: name from environment', bcDraft.name, 'SANDBOX');
  check('new rule: environment from BC URL', bcDraft.conditions,
    [{ field: 'environment', op: 'equals', value: 'Sandbox' }]);

  var googleDraft = BCBuddy.draftFromContext(BCBuddy.parseUrl('https://www.google.com/shopping'));
  check('new rule: full URL for non-BC site', googleDraft.conditions,
    [{ field: 'url', op: 'contains', value: 'https://www.google.com/shopping' }]);
  check('new rule: name for non-BC site', googleDraft.name, 'SHOPPING');

  var hostOnly = BCBuddy.draftFromContext(BCBuddy.parseUrl('https://intranet.local/'));
  check('new rule: name falls back to host', hostOnly.name, 'INTRANET.LOCAL');
  check('new rule: without URL an empty condition',
    BCBuddy.draftFromContext(BCBuddy.parseUrl('')).conditions,
    [{ field: 'environment', op: 'contains', value: '' }]);
  check('new rule: without URL a neutral name',
    BCBuddy.draftFromContext(BCBuddy.parseUrl('')).name,
    chrome.i18n.getMessage('newRuleName').toUpperCase());

  // styles: display separate from the rule
  var style = BCBuddy.normalizeStyle({
    id: 'lay-1', name: 'Standaard',
    ribbon: { enabled: true, text: 'STYLE {environment}' },
    border: { enabled: true, width: 4 },
    banner: { enabled: true, position: 'bottom-left', text: 'uit de style' },
    title: { enabled: true, text: 'L {title}' },
    favicon: { enabled: true, text: 'LA' }
  });
  var linkedRule = BCBuddy.normalizeRule({
    name: 'TEST', color: '#c4314b', styleId: 'lay-1',
    conditions: [{ field: 'environment', op: 'contains', value: 'Sandbox' }],
    favicon: { text: 'TS' },
    ribbon: { enabled: false, text: 'EIGEN TEKST' },
    border: { enabled: true, width: 2 }
  });

  check('style: has no color', Object.prototype.hasOwnProperty.call(style, 'color'), false);
  check('style: rule drops embedded display', Object.prototype.hasOwnProperty.call(linkedRule, 'ribbon'), false);
  check('style: rule keeps its own styleId', linkedRule.styleId, 'lay-1');
  check('style: without choice rule follows the only style',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({}), [style]).ribbon.text,
    'STYLE {environment}');
  check('style: without choice rule follows first style',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({}),
      [style, BCBuddy.normalizeStyle({ id: 'lay-2', name: 'Tweede' })]).ribbon.text,
    'STYLE {environment}');
  check('style: missing style falls back to first',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({ styleId: 'bestaat-niet' }),
      [style]).ribbon.text, 'STYLE {environment}');
  check('style: without styles uses defaults',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({}), []).border.width, 3);

  var resolvedRule = BCBuddy.resolveRule(linkedRule, [style]);
  check('style: ribbon comes from style', resolvedRule.ribbon.text, 'STYLE {environment}');
  check('style: border comes from style', resolvedRule.border.width, 4);
  check('style: banner comes from style', resolvedRule.banner.position, 'bottom-left');
  check('style: title comes from style', resolvedRule.title.text, 'L {title}');
  check('style: favicon enabled comes from style', resolvedRule.favicon.enabled, true);
  check('style: favicon letters stay from rule', resolvedRule.favicon.text, 'TS');
  check('style: style carries no letters itself', style.favicon.text, '');
  check('style: name stays from rule', resolvedRule.name, 'TEST');
  check('style: color stays from rule', resolvedRule.color, '#c4314b');
  check('style: conditions stay from rule', resolvedRule.conditions.length, 1);
  check('style: rule itself is not modified', linkedRule.favicon.text, 'TS');
  check('style: without styles resolved rule has defaults',
    BCBuddy.resolveRule(linkedRule, []).border.width, 3);

  var otherStyle = BCBuddy.normalizeStyle({
    id: 'lay-2', name: 'Compact', border: { width: 1 }, ribbon: { text: 'ANDERS' }
  });
  var ownStyle = BCBuddy.normalizeRule({ name: 'EIGEN', styleId: 'lay-2' });
  check('style: rule can pick its own style',
    BCBuddy.resolveRule(ownStyle, [style, otherStyle]).ribbon.text, 'ANDERS');

  var withStyleSettings = BCBuddy.normalize({
    rules: [linkedRule],
    styles: [style]
  });
  check('style: effective rules are resolved',
    BCBuddy.effectiveRules(withStyleSettings)[0].border.width, 4);
  check('style: stored in settings', withStyleSettings.styles.length, 1);
  check('style: stored rule has no border',
    Object.prototype.hasOwnProperty.call(withStyleSettings.rules[0], 'border'), false);

  // shared rules look at shared styles first
  var shared = BCBuddy.normalize({
    hosted: {
      rules: [BCBuddy.normalizeRule({ name: 'GEDEELD', styleId: 'lay-h' })],
      styles: [BCBuddy.normalizeStyle({ id: 'lay-h', name: 'Gedeeld', border: { width: 2 } })]
    }
  });
  check('style: shared rule uses shared style',
    BCBuddy.effectiveRules(shared)[0].border.width, 2);

  // first match wins, own rules before shared
  var settings = BCBuddy.normalize({
    rules: [BCBuddy.normalizeRule({ name: 'EIGEN', conditions: [{ field: 'environment', op: 'contains', value: 'sandbox' }] })],
    hosted: { rules: [BCBuddy.normalizeRule({ name: 'GEDEELD', conditions: [{ field: 'url', op: 'contains', value: 'businesscentral' }] })] }
  });
  check('priority: own rule beats shared', BCBuddy.findRule(BCBuddy.effectiveRules(settings), saas).name, 'EIGEN');

  // maximize follows the master switch as well as its own toggle
  check('maximize: on by default', BCBuddy.maximizeOn(BCBuddy.normalize(null)), true);
  check('maximize: off with its own toggle',
    BCBuddy.maximizeOn(BCBuddy.normalize({ maximize: { enabled: false } })), false);
  check('maximize: off when the extension is off',
    BCBuddy.maximizeOn(BCBuddy.normalize({ enabled: false, maximize: { enabled: true } })), false);

  // animations: calm.js gives element.animate() a duration of 0 while
  // data-bcb-calm is on <html>, and leaves endless animations alone. Checked
  // straight after the observer's microtask, before the content script's
  // watch loop takes the attribute off again on this page.
  function calmDom() {
    var root = document.documentElement;
    var el = document.body.appendChild(document.createElement('div'));
    function timing(options) {
      var anim = el.animate({ opacity: [0, 1] }, options);
      var t = anim.effect.getTiming();
      anim.cancel();
      return t;
    }
    check('animations: untouched before the attribute appears', timing({ duration: 500 }).duration, 500);
    root.setAttribute('data-bcb-calm', '');
    return Promise.resolve().then(function () {
      var t = timing({ duration: 500, delay: 300, fill: 'forwards' });
      check('animations: duration and delay go to 0', [t.duration, t.delay, t.fill], [0, 0, 'forwards']);
      check('animations: a bare number becomes 0', timing(500).duration, 0);
      check('animations: endless ones keep their timing',
        timing({ duration: 1000, iterations: Infinity }).duration, 1000);
      root.removeAttribute('data-bcb-calm');
      check('animations: switching off restores BC timing', timing({ duration: 500 }).duration, 500);
      el.remove();
    });
  }

  function dropdownDom() {
    var css = document.createElement('style');
    css.textContent = BC_LOOKUP_CSS;
    document.head.appendChild(css);
    var container = document.createElement('div');
    container.className = 'spa-container spa-stack-container-1';
    document.body.appendChild(container);

    function tick() { return new Promise(function (resolve) { setTimeout(resolve, 0); }); }
    function vars(el) {
      return [el.style.getPropertyValue('--bcb-dropdown-width'), el.style.getPropertyValue('--bcb-dropdown-height')];
    }
    function open(lookup, parent) {
      (parent || container).appendChild(lookup);
      return tick().then(function () { return lookup; });
    }
    function closeAll() {
      document.querySelectorAll('.spa-lookup').forEach(function (l) { l.remove(); });
    }

    var sizer = D.attach(document, { width: 3, height: 5 });
    var wide;
    return open(lookupFixture(WIDE)).then(function (lookup) {
      wide = lookup;
      truthy('dropdown DOM: a lookup in a container is sized', wide.hasAttribute(D.MARK));
      check('dropdown DOM: height step 5 is BC height x 1.5', vars(wide)[1], '357px');

      // Independent of the sizer: the header at width 0 is what its columns need.
      var header = wide.querySelector('table.ms-nav-grid-header-table');
      header.style.width = '0px';
      var natural = header.offsetWidth;
      header.style.width = '';
      var edges = wide.offsetWidth - header.parentElement.clientWidth;
      var expected = natural - 15 + edges + 17; // without BC's gutter, with room for a scrollbar
      var width = parseFloat(vars(wide)[0]);
      truthy('dropdown DOM: wide lookup fits its columns (' + width + ' vs ' + expected + ')',
        Math.abs(width - expected) <= 1);
      truthy('dropdown DOM: and stays within BC standard and the maximum', width >= 532 && width <= 798);

      var parts = [wide, wide.querySelector('form'), wide.querySelector('.ms-nav-content'),
        wide.querySelector('.ms-nav-content .ms-nav-lookupform')];
      check('dropdown DOM: all four BC caps take the width',
        parts.map(function (el) { return getComputedStyle(el).maxWidth; }),
        [width + 'px', width + 'px', width + 'px', width + 'px']);
      check('dropdown DOM: all four BC caps take the height',
        parts.map(function (el) { return getComputedStyle(el).maxHeight; }), ['357px', '357px', '357px', '357px']);
      return open(lookupFixture(NARROW));
    }).then(function (narrow) {
      check('dropdown DOM: narrow lookup keeps BC width', vars(narrow)[0], '532px');
      return open(lookupFixture(['120px', '200px']));
    }).then(function (unsized) {
      check('dropdown DOM: columns without ex widths take the maximum', vars(unsized)[0], '1064px');
      return open(lookupFixture(WIDE, 'spa-preview-lookup'));
    }).then(function (preview) {
      check('dropdown DOM: hover preview is left alone', preview.hasAttribute(D.MARK), false);
      return open(recordCardFixture());
    }).then(function (card) {
      check('dropdown DOM: record card is left alone, before BC marks it as a preview',
        [card.hasAttribute(D.MARK), vars(card)], [false, ['', '']]);
      card.classList.add('spa-preview-lookup');
      var noGrid = lookupFixture(WIDE);
      noGrid.querySelector('.ms-nav-grid-vertical-container').remove();
      return open(noGrid);
    }).then(function (noGrid) {
      check('dropdown DOM: a popup without a list is left alone', noGrid.hasAttribute(D.MARK), false);
      // Should BC ever turn a sized popup into a card, the caps let go of it.
      var turned = lookupFixture(WIDE);
      return open(turned);
    }).then(function (turned) {
      truthy('dropdown DOM: (list sized first)', turned.hasAttribute(D.MARK));
      turned.classList.add('spa-preview-lookup');
      check('dropdown DOM: a sized popup that becomes a card gets BC caps back',
        getComputedStyle(turned).maxWidth, '532px');
      turned.remove();
      var nested = document.createElement('div');
      container.appendChild(nested);
      return open(lookupFixture(WIDE), nested);
    }).then(function (deep) {
      check('dropdown DOM: only direct children of a container are watched', deep.hasAttribute(D.MARK), false);
      var later = document.createElement('div');
      later.className = 'spa-container spa-stack-container-2';
      document.body.appendChild(later);
      return tick().then(function () { return open(lookupFixture(WIDE), later); });
    }).then(function (inLater) {
      truthy('dropdown DOM: a container added later is watched too', inLater.hasAttribute(D.MARK));

      sizer.detach();
      check('dropdown DOM: detach hands the open lookups back to BC',
        [wide.hasAttribute(D.MARK), vars(wide)], [false, ['', '']]);
      return open(lookupFixture(WIDE));
    }).then(function (afterDetach) {
      check('dropdown DOM: nothing is sized after detach', afterDetach.hasAttribute(D.MARK), false);
      closeAll();
      sizer = D.attach(document, { width: 1, height: 3 });
      return open(lookupFixture(WIDE));
    }).then(function (heightOnly) {
      check('dropdown DOM: width at BC standard stays BC width, even when columns want more',
        vars(heightOnly), ['532px', '298px']);
      sizer.detach();
      closeAll();
      // A BC release with different caps: the steps scale along.
      css.textContent += '\n.spa-view.spa-lookup{max-width:600px;max-height:300px}';
      sizer = D.attach(document, { width: 5, height: 5 });

      check('dropdown DOM: BC standard is read from BC, not assumed', vars(rescaled), ['600px', '450px']);
      return open(lookupFixture(['500ex']));
    }).then(function (huge) {
      check('dropdown DOM: maximum is three times what BC uses', vars(huge)[0], '1800px');
      sizer.detach();
      closeAll();
      document.querySelectorAll('.spa-container').forEach(function (c) { c.remove(); });
      css.remove();
    });
  }

  /**
   * The language picked on the options page. On a test page i18n.js is not in
   * an extension context, so it asks the "service worker" (this sendMessage).
   */
  function languageOverride() {
    var send = chrome.runtime.sendMessage;
    var asked = [];
    chrome.runtime.sendMessage = function (message) {
      asked.push(message);
      return Promise.resolve({ newRuleName: 'Nouvelle règle', errHttp: 'HTTP $1 ($2) $$', bad: 7,
        fullStyleName: 'Complet' });
    };
    function restore() {
      chrome.runtime.sendMessage = send;
      delete STORE[BCBuddy.LANGUAGE_KEY];
      return BCBuddy.loadLanguage();
    }
    check('language: unknown choice means browser', BCBuddy.normalizeLanguage('de'), '');
    check('language: known choice kept', BCBuddy.normalizeLanguage('fr'), 'fr');
    STORE[BCBuddy.LANGUAGE_KEY] = 'en';
    return BCBuddy.loadLanguage().then(function (lang) {
      check('language: same as the browser loads nothing', lang + '|' + asked.length, '|0');
      STORE[BCBuddy.LANGUAGE_KEY] = '<script>';
      return BCBuddy.loadLanguage();
    }).then(function (lang) {
      check('language: a stored value off the list is ignored', lang + '|' + asked.length, '|0');
      STORE[BCBuddy.LANGUAGE_KEY] = 'fr';
      return BCBuddy.loadLanguage();
    }).then(function (lang) {
      check('language: override loaded', lang, 'fr');
      check('language: asked the worker for fr', asked[0] && asked[0].type + ':' + asked[0].lang, 'bcb:messages:fr');
      check('language: t() uses the override', BCBuddy.t('newRuleName'), 'Nouvelle règle');
      check('language: substitutions and $$', BCBuddy.t('errHttp', [404, 'Not Found']), 'HTTP 404 (Not Found) $');
      check('language: missing key falls back to Chrome', BCBuddy.t('rulesHeading'), chrome.i18n.getMessage('rulesHeading'));
      check('language: non-string value dropped', BCBuddy.t('bad'), 'bad');
      check('language: current language', BCBuddy.currentLanguage(), 'fr');
      var named = BCBuddy.localizeSamples({ rules: [], styles: [
        BCBuddy.normalizeStyle({ id: 'full', name: 'Full' }),
        BCBuddy.normalizeStyle({ id: 'mine', name: 'Full' }),
        BCBuddy.normalizeStyle({ id: '__proto__', name: 'Odd' })] });
      check('language: sample styles named in the chosen language, others left alone',
        named.styles.map(function (l) { return l.name; }), ['Complet', 'Full', 'Odd']);
      return restore();
    }).then(function (lang) {
      check('language: back to the browser', lang + '|' + BCBuddy.t('newRuleName'), '|' + chrome.i18n.getMessage('newRuleName'));
    }, function (err) {
      return restore().then(function () { throw err; });
    });
  }

  // keyboard shortcuts: an open panel follows BC to the next page. Pages are
  // sibling .spa-view elements; the one below stays rendered, so its
  // actions must not be listed. A lookup leaves the panel as it is.
  function shortcutsDom() {
    var S = BCBuddy.Shortcuts;
    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    function view(form, action) {
      var v = document.createElement('div');
      v.className = 'spa-view';
      v.innerHTML = '<form class="ms-nav-root-form ' + form + '">' + action + '</form>';
      return v;
    }
    function titles() {
      return [].map.call(document.querySelectorAll('#' + S.PANEL_ID + ' h3'), function (h) {
        return h.firstChild.textContent;
      });
    }
    function names() {
      return [].map.call(document.querySelectorAll('#' + S.PANEL_ID + ' dl:first-of-type dd'), function (d) {
        return d.textContent;
      });
    }
    var box = document.createElement('div');
    box.className = 'spa-container';
    var list = view('ms-nav-listform', '<button title="Open the card. (Shift+F7)">Edit</button>');
    box.appendChild(list);
    document.body.appendChild(box);
    var handle = S.attach(document, { t: function (k) { return '[' + k + ']'; }, icon: false });
    handle.toggle();
    check('shortcuts panel: a list page', [titles(), names()],
      [['[scPage]', '[scList]', '[scAnywhere]'], ['Edit']]);

    list.classList.add('spa-not-top-most');
    list.setAttribute('inert', '');
    var card = view('ms-nav-cardform', '<button title="Finalize. (F9)">Post</button>');
    box.appendChild(card);
    return wait(400).then(function () {
      check('shortcuts panel: follows BC to the card, without the list below',
        [titles(), names()], [['[scPage]', '[scCard]', '[scAnywhere]'], ['Post']]);
      var lookup = document.createElement('div');
      lookup.className = 'spa-view spa-lookup';
      lookup.innerHTML = '<form class="ms-nav-root-form ms-nav-lookupform"></form>';
      box.appendChild(lookup);
      return wait(400).then(function () {
        check('shortcuts panel: a lookup leaves it as it is', titles(), ['[scPage]', '[scCard]', '[scAnywhere]']);
        lookup.remove();
        card.remove();
        list.classList.remove('spa-not-top-most');
        list.removeAttribute('inert');
        return wait(400);
      });
    }).then(function () {
      check('shortcuts panel: back on the list', [titles(), names()],
        [['[scPage]', '[scList]', '[scAnywhere]'], ['Edit']]);
      handle.detach();
      box.remove();
    });
  }

  function copyDom() {
    var C = BCBuddy.CopyValues;
    var host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:0;top:0;background:#fff';
    host.innerHTML = COPY_FIXTURE;
    document.body.appendChild(host);
    function cell(k) { return host.querySelector('[data-k="' + k + '"]'); }
    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    function over(el, type) {
      el.dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: type || 'mouse' }));
    }

    check('copy values: which cells get the icon',
      ['menu', 'link', 'text', 'amount', 'empty', 'emptylink', 'bool', 'hidden', 'edit', 'factbox',
        'cardlink', 'card', 'cardedit', 'loose', 'lookup', 'inspage', 'insfield', 'insblank', 'brick']
        .map(function (k) { return k + ':' + !!C.valueOf(cell(k)); }),
      ['menu:false', 'link:true', 'text:true', 'amount:true', 'empty:false', 'emptylink:false', 'bool:false',
        'hidden:false', 'edit:false', 'factbox:true',
        'cardlink:true', 'card:false', 'cardedit:false', 'loose:false', 'lookup:false',
        'inspage:true', 'insfield:true', 'insblank:false', 'brick:false']);
    check('copy values: a Page Inspection field copies its value, not its name',
      C.textOf(C.valueOf(cell('insfield'))), '00000021');
    var tile = C.boxOf(cell('insfield'), cell('insvalue'));
    var line = cell('insvalue').getBoundingClientRect();
    check('copy values: on a Page Inspection field, left of the ... menu, on the value line',
      [tile.right, tile.top, tile.height],
      [cell('insmenu').getBoundingClientRect().left, line.top, line.height]);
    check('copy values: a link copies its text, not its title', C.textOf(C.valueOf(cell('link'))), '10000');
    check('copy values: a cut-off value is copied whole, trimmed',
      C.textOf(C.valueOf(cell('text'))), 'Adatum Corporation 2111111111111321 31313');
    check('copy values: an amount is copied as shown', C.textOf(C.valueOf(cell('amount'))), '3.515,66');
    check('copy values: text gets the icon on the right, amounts on the left',
      [C.sideOf(cell('text')), C.sideOf(cell('amount')), C.sideOf(cell('factbox'))], ['right', 'left', 'left']);
    var box = { left: 100, right: 300, top: 10, height: 30 };
    check('copy values: placed inside the cell, vertically centred',
      [C.place(box, 'right'), C.place(box, 'left')], [{ x: 278, y: 15 }, { x: 102, y: 15 }]);
    check('copy values: on the left, just before a short value',
      C.place(box, 'left', { left: 250 }), { x: 226, y: 15 });
    check('copy values: but never outside the cell',
      C.place(box, 'left', { left: 110 }), { x: 102, y: 15 });

    var copied = [];
    Object.defineProperty(navigator, 'clipboard', {
      configurable: true,
      value: { writeText: function (text) { copied.push(text); return Promise.resolve(); } }
    });
    var handle = C.attach(document, { copy: 'Copy value', copied: 'Copied' });
    var icon = handle.icon;
    function showing() { return icon.isConnected && !icon.hidden; }
    function at() {
      var r = icon.getBoundingClientRect();
      return [Math.round(r.left), Math.round(r.top)];
    }
    function expected(k, side) {
      var text = side === 'left' ? C.textRect(C.valueOf(cell(k))) : null;
      var p = C.place(cell(k).getBoundingClientRect(), side, text);
      return [p.x, p.y];
    }

    over(cell('text').firstChild);
    check('copy values: nothing before the pointer rests', showing(), false);
    return wait(C.REST_MS + 50).then(function () {
      check('copy values: the icon shows after a rest', showing(), true);
      check('copy values: at the right edge of a text cell', at(), expected('text', 'right'));
      check('copy values: the icon is our own element in body', icon.parentNode, document.body);
      check('copy values: labelled', [icon.title, icon.getAttribute('aria-label')], ['Copy value', 'Copy value']);
      over(cell('text'));
      check('copy values: moving inside the cell keeps it', showing(), true);
      over(icon);
      check('copy values: moving onto the icon keeps it', showing(), true);
      icon.click();
      return wait(0);
    }).then(function () {
      check('copy values: the click copies the whole value', copied, ['Adatum Corporation 2111111111111321 31313']);
      check('copy values: then a tick', [icon.classList.contains('bcb-copy--done'), icon.title], [true, 'Copied']);
      over(cell('amount'));
      check('copy values: another cell hides it at once', showing(), false);
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: amounts get it on the left, before the value', at(), expected('amount', 'left'));
      check('copy values: the tick is gone on a new cell', icon.classList.contains('bcb-copy--done'), false);
      document.dispatchEvent(new Event('scroll'));
      check('copy values: scrolling hides it', showing(), false);
      over(cell('factbox'));
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: a FactBox value gets it too', showing(), true);
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'a' }));
      check('copy values: typing hides it', showing(), false);
      over(cell('link'));
      return wait(100);
    }).then(function () {
      over(cell('edit'));
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: sweeping on to an editable cell shows nothing', showing(), false);
      over(cell('bool'));
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: nothing on a check box', showing(), false);
      over(cell('card'));
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: nothing on plain text on a card', showing(), false);
      over(cell('cardlink'));
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: a link on a card gets it, before the amount', at(), expected('cardlink', 'left'));
      // On a card the link is a block as wide as the field: the icon still
      // goes next to the text, not to the far left of the field.
      var field = cell('cardlink').getBoundingClientRect();
      truthy('copy values: on a card, next to the text and not at the field edge',
        at()[0] > field.left + field.width / 2);
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'a' }));
      over(cell('link'), 'touch');
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: nothing on touch', showing(), false);
      handle.detach();
      check('copy values: detach removes the icon', document.getElementById(C.ICON_ID), null);
      over(cell('link'));
      return wait(C.REST_MS + 50);
    }).then(function () {
      check('copy values: and stops listening', document.getElementById(C.ICON_ID), null);
    }).then(function () {
      delete navigator.clipboard;
      host.remove();
    }, function (err) {
      delete navigator.clipboard;
      host.remove();
      throw err;
    });
  }

  // open in a new tab, the flow: a stack of BC pages as the live client has
  // it (BC SaaS, 2026-10-11), and a stand-in for BC that opens a page on a
  // click, puts its address in the address bar a moment later and closes it
  // again on Back.
  function newTabFlowDom() {
    var N = BCBuddy.NewTab;
    // Which values count as a link: the copy values markup, from BC.
    var host = document.createElement('div');
    host.innerHTML = COPY_FIXTURE;
    document.body.appendChild(host);
    check('new tab: which cells are links',
      ['link', 'text', 'amount', 'emptylink', 'edit', 'factbox', 'cardlink', 'card', 'loose', 'lookup']
        .map(function (k) { return k + ':' + !!N.linkOf(host.querySelector('[data-k="' + k + '"]')); }),
      ['link:true', 'text:false', 'amount:true', 'emptylink:false', 'edit:false', 'factbox:false',
        'cardlink:true', 'card:false', 'loose:false', 'lookup:false']);
    host.remove();

    var stack = document.createElement('div');
    stack.className = 'spa-container';
    stack.style.cssText = 'position:absolute;left:0;top:0;width:400px;height:200px';
    stack.innerHTML =
      '<div class="spa-view" data-v="order" style="position:absolute;inset:0;background:#fff">' +
      '<div class="ms-nav-layout-factbox-content-area" style="width:240px"><div class="edit-container edit-container-read" data-k="fb">' +
      '<a class="stringcontrol-read value" role="button" href="javascript:;">10000</a></div></div>' +
      '<table class="ms-nav-grid-data-table"><tbody><tr><td class="edit-container edit-container-read" data-k="grid">' +
      '<a class="stringcontrol-read value" role="button" href="javascript:;">101001</a></td></tr></tbody></table>' +
      '</div>';
    document.body.appendChild(stack);
    var origin = stack.querySelector('[data-v="order"]');
    var fb = stack.querySelector('[data-k="fb"] a');
    var grid = stack.querySelector('[data-k="grid"] a');
    var ORDER = 'https://bc.example/?page=42';
    var href = ORDER;
    var mode = 'card';
    var bc = { clicks: 0, ctrl: 0 };

    var reached = null; // the last event BC saw
    stack.addEventListener('auxclick', function (e) { reached = e; });
    stack.addEventListener('click', function (e) {
      reached = e;
      if (!e.target.closest('a.stringcontrol-read')) return;
      e.preventDefault(); // javascript:; does nothing anyway
      if (e.ctrlKey) { bc.ctrl++; return; } // BC selects the row
      bc.clicks++;
      if (mode === 'none') return;
      var kind = mode;
      setTimeout(function () {
        origin.classList.add('spa-not-top-most');
        origin.setAttribute('inert', '');
        var view = document.createElement('div');
        view.className = 'spa-view';
        view.setAttribute('data-v', kind);
        view.style.cssText = 'position:absolute;inset:0;background:#fff';
        view.innerHTML = '<button type="button"><i data-icon-name="Back"></i></button>';
        view.querySelector('button').addEventListener('click', function () {
          setTimeout(function () {
            view.remove();
            origin.classList.remove('spa-not-top-most');
            origin.removeAttribute('inert');
            href = ORDER;
          }, 30);
        });
        stack.appendChild(view);
        if (kind === 'card') setTimeout(function () { href = 'https://bc.example/?page=21&bookmark=X'; }, 20);
      }, 30);
    });

    var opened = [];
    var handle = N.attach(document, function (url, active) { opened.push([url, active]); },
      { hrefOf: function () { return href; }, dialogMs: 200, trusted: function () { return true; } });
    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    function top() { return BCBuddy.Maximize.topView(document).getAttribute('data-v'); }
    function busy() {
      return [document.documentElement.hasAttribute(N.BUSY_ATTR), origin.hasAttribute(N.ORIGIN_ATTR)];
    }
    // Whether BC Buddy took the click: then BC never sees it.
    function press(el, type, init) {
      var event = new MouseEvent(type, Object.assign({ bubbles: true, cancelable: true }, init));
      reached = null;
      el.dispatchEvent(event);
      return reached !== event;
    }

    // Without the test's trusted(), a click the page made up stays BC's.
    var strict = N.attach(document, function (url, active) { opened.push([url, active]); },
      { hrefOf: function () { return href; }, dialogMs: 200 });
    handle.detach();
    mode = 'none';
    check('new tab flow: a made-up Ctrl+click is left to BC',
      [press(fb, 'click', { button: 0, ctrlKey: true }), bc.ctrl], [false, 1]);
    check('new tab flow: a made-up middle-click is left to BC',
      press(grid, 'auxclick', { button: 1 }), false);
    strict.detach();
    bc.ctrl = 0;
    mode = 'card';
    handle = N.attach(document, function (url, active) { opened.push([url, active]); },
      { hrefOf: function () { return href; }, dialogMs: 200, trusted: function () { return true; } });

    var running = handle.open(fb, false);
    var second = handle.open(grid, false);
    return wait(100).then(function () {
      var card = stack.querySelector('[data-v="card"]');
      check('new tab flow: BC opens the page as on a click', [bc.clicks, !!card], [1, true]);
      check('new tab flow: meanwhile it is out of sight',
        [busy(), card && getComputedStyle(card).visibility, getComputedStyle(origin).visibility],
        [[true, true], 'hidden', 'visible']);
      return Promise.all([running, second]);
    }).then(function (result) {
      check('new tab flow: one at a time', [result, bc.clicks], [['tab', 'kept'], 1]);
      check('new tab flow: the address BC showed goes to a new tab, in the background',
        opened, [['https://bc.example/?page=21&bookmark=X', false]]);
      check('new tab flow: and you are back where you were', [top(), href, busy()], ['order', ORDER, [false, false]]);
      mode = 'none';
      check('new tab flow: a plain click is BC\'s', [press(fb, 'click', { button: 0 }), bc.clicks], [false, 2]);
      mode = 'card';
      check('new tab flow: Ctrl+click on a FactBox link is ours', press(fb, 'click', { button: 0, ctrlKey: true }), true);
      return wait(500);
    }).then(function () {
      check('new tab flow: and opens it in a new tab', [opened.length, bc.ctrl, top()], [2, 0, 'order']);
      check('new tab flow: Ctrl+click in a list stays BC\'s (it selects rows)',
        [press(grid, 'click', { button: 0, ctrlKey: true }), bc.ctrl], [false, 1]);
      check('new tab flow: a middle-click in a list is ours', press(grid, 'auxclick', { button: 1 }), true);
      return wait(500);
    }).then(function () {
      check('new tab flow: a middle-click opens it in a new tab', [opened.length, top()], [3, 'order']);
      check('new tab flow: Ctrl+Shift+click is ours too',
        press(fb, 'click', { button: 0, ctrlKey: true, shiftKey: true }), true);
      return wait(500);
    }).then(function () {
      check('new tab flow: and opens the tab in front', opened[3] && opened[3][1], true);
      mode = 'dialog';
      return handle.open(fb, false);
    }).then(function (result) {
      check('new tab flow: a page with no address of its own (a dialog) is left to BC',
        [result, opened.length, top(), busy()], ['kept', 4, 'dialog', [false, false]]);
      stack.querySelector('[data-v="dialog"] button').click();
      return wait(100);
    }).then(function () {
      mode = 'none';
      handle.detach();
      check('new tab flow: after detach Ctrl+click is BC\'s again',
        [press(fb, 'click', { button: 0, ctrlKey: true }), bc.ctrl], [false, 2]);
      stack.remove();
    }, function (err) {
      handle.detach();
      stack.remove();
      throw err;
    });
  }

  /* ---- rules on a page that stays open ------------------------------------
   * Business Central never reloads: settings change while it is open, and a
   * company or environment switch only changes the address. Each step writes
   * settings the way the options page does; the content script hears it
   * through chrome.storage.onChanged and redraws at once.
   */
  var SEED = JSON.parse(JSON.stringify(STORE[BCBuddy.STORAGE_KEY]));
  var BASE = location.href.split('#')[0];
  var HERE = { field: 'url', op: 'contains', value: 'test-core' };

  function settle(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  function useSettings(settings) {
    var change = {};
    change[BCBuddy.STORAGE_KEY] = settings;
    return chrome.storage.local.set(change);
  }

  /** One style with every marking on, and rules that all use it. */
  function markedSettings(banner, rules) {
    return BCBuddy.normalize({
      enabled: true,
      styles: [BCBuddy.normalizeStyle({
        id: 'lay-dom',
        name: 'DOM',
        ribbon: { enabled: true, text: '{name}' },
        border: { enabled: true, width: 3 },
        banner: Object.assign({ enabled: true, position: 'top-right', text: '{name}' }, banner),
        title: { enabled: true, text: '[{name}] {title}' },
        favicon: { enabled: true }
      })],
      rules: rules.map(function (rule) {
        return BCBuddy.normalizeRule(Object.assign({ styleId: 'lay-dom', color: '#0f6cbd' }, rule));
      })
    });
  }

  function bannerText() {
    var banner = document.getElementById('bcb-banner');
    return banner ? banner.textContent : null;
  }

  function brandText() {
    var brand = document.querySelector('#fakeHeader .brand-text');
    return brand ? brand.textContent : null;
  }

  // Every banner position, measured where it lands in the window rather than
  // by its class name alone.
  function bannerPositionsDom() {
    var W = window.innerWidth;
    var H = window.innerHeight;
    function centre(r) { return [r.left + r.width / 2, r.top + r.height / 2]; }
    var lands = {
      'bottom': function (r) { return r.bottom >= H - 1 && r.width >= W - 1; },
      'top-right': function (r) { return centre(r)[0] > W / 2 && centre(r)[1] < H / 2; },
      'top-left': function (r) { return centre(r)[0] < W / 2 && centre(r)[1] < H / 2; },
      'bottom-right': function (r) { return centre(r)[0] > W / 2 && centre(r)[1] > H / 2; },
      'bottom-left': function (r) { return centre(r)[0] < W / 2 && centre(r)[1] > H / 2; }
    };
    check('banner DOM: every position is tested', Object.keys(lands).sort(), BCBuddy.POSITIONS.slice().sort());

    return BCBuddy.POSITIONS.reduce(function (chain, position) {
      return chain.then(function () {
        return useSettings(markedSettings({ position: position }, [{ name: 'POS', conditions: [HERE] }]));
      }).then(function () {
        var banner = document.getElementById('bcb-banner');
        var rect = banner ? banner.getBoundingClientRect() : null;
        truthy('banner DOM: ' + position + ' lands in its place', !!rect && lands[position](rect));
        check('banner DOM: ' + position + ' is the only banner', document.querySelectorAll('#bcb-banner').length, 1);
        check('banner DOM: ' + position + ' shows its text', bannerText(), 'POS');
      });
    }, Promise.resolve());
  }

  // A long rule name shrinks the banner to its smallest size and never widens
  // the page; the tab title and the ribbon still hold all of it.
  function longNameDom() {
    // About 450 characters: wider than the window even at the smallest size.
    var name = 'CONTOSO' + new Array(41).join(' PRODUCTION');
    var widthBefore = document.documentElement.scrollWidth;
    return useSettings(markedSettings({ position: 'bottom' }, [{ name: name, conditions: [HERE] }]))
      .then(function () {
        var banner = document.getElementById('bcb-banner');
        check('long name: bottom banner shrinks to the smallest size', banner && banner.style.fontSize, '9px');
        truthy('long name: bottom banner stays inside the window',
          !!banner && banner.getBoundingClientRect().right <= window.innerWidth + 1);
        check('long name: tab title holds the whole name', document.title, '[' + name + '] BCBuddy core');
        check('long name: ribbon holds the whole name', brandText(), name);
        truthy('long name: the page does not get wider (' + document.documentElement.scrollWidth + ' vs ' + widthBefore + ')',
          document.documentElement.scrollWidth <= widthBefore);
        return useSettings(markedSettings({ position: 'top-right' }, [{ name: name, conditions: [HERE] }]));
      }).then(function () {
        var banner = document.getElementById('bcb-banner');
        check('long name: corner ribbon shrinks to the smallest size', banner && banner.style.fontSize, '9px');
        truthy('long name: corner ribbon does not widen the page',
          document.documentElement.scrollWidth <= widthBefore);
      });
  }

  // 200 rules, a quarter of them RegEx, the only fitting one last. Matching
  // must run once per address and per settings change, never on the poll or
  // on a burst of DOM changes: that loop runs in every BC tab all day.
  function manyRulesDom() {
    var rules = [];
    var i;
    for (i = 0; i < 150; i++) {
      rules.push({ name: 'C' + i, conditions: [{ field: 'url', op: 'contains', value: 'nowhere-' + i }] });
    }
    for (i = 0; i < 49; i++) {
      rules.push({ name: 'R' + i, conditions: [{ field: 'url', op: 'regex', value: '^https://nowhere-' + i + '\\.example/' }] });
    }
    rules.push({ name: 'LAST', color: '#8764b8', conditions: [HERE] });

    var calls = { find: 0, effective: 0 };
    var findRule = BCBuddy.findRule;
    var effectiveRules = BCBuddy.effectiveRules;
    BCBuddy.findRule = function () { calls.find++; return findRule.apply(this, arguments); };
    BCBuddy.effectiveRules = function () { calls.effective++; return effectiveRules.apply(this, arguments); };
    function restore() {
      BCBuddy.findRule = findRule;
      BCBuddy.effectiveRules = effectiveRules;
    }

    return useSettings(markedSettings({}, rules)).then(function () {
      check('many rules: rule 200 still fits', bannerText(), 'LAST');
      check('many rules: matched once after the settings changed', [calls.find, calls.effective], [1, 1]);
      document.body.appendChild(document.createElement('span')); // wakes the observer
      return settle(2000);
    }).then(function () {
      check('many rules: polls and DOM changes on the same address match nothing again',
        [calls.find, calls.effective], [1, 1]);
      history.replaceState(null, '', BASE + '#bcb-many');
      return settle(1000);
    }).then(function () {
      check('many rules: a new address is matched once more, with the same rules',
        [calls.find, calls.effective], [2, 1]);
      history.replaceState(null, '', BASE);
      return settle(1000);
    }).then(restore, function (err) {
      restore();
      history.replaceState(null, '', BASE);
      throw err;
    });
  }

  // Switching company or environment in BC changes the address without a
  // reload, and without a popstate either: only the poll notices. The marking
  // must follow, and disappear when no rule fits the new address.
  function navigationDom() {
    var settings = markedSettings({}, [
      { name: 'NAVPROD', color: '#aa0000', conditions: [{ field: 'url', op: 'contains', value: 'bcb-env=prod' }] },
      { name: 'NAVBASE', color: '#006600',
        conditions: [HERE, { field: 'url', op: 'notContains', value: 'bcb-env=none' }] }
    ]);
    function frameColor() {
      var frame = document.getElementById('bcb-frame');
      return frame ? getComputedStyle(frame).borderTopColor : null;
    }

    return useSettings(settings).then(function () {
      check('navigation: starts on the base rule', [bannerText(), frameColor()], ['NAVBASE', 'rgb(0, 102, 0)']);
      history.replaceState(null, '', BASE + '#bcb-env=prod');
      return settle(1000);
    }).then(function () {
      check('navigation: another environment recolours the open tab',
        [bannerText(), frameColor(), document.title, brandText()],
        ['NAVPROD', 'rgb(170, 0, 0)', '[NAVPROD] BCBuddy core', 'NAVPROD']);
      check('navigation: still one frame and one banner',
        [document.querySelectorAll('#bcb-frame').length, document.querySelectorAll('#bcb-banner').length], [1, 1]);
      history.replaceState(null, '', BASE + '#bcb-env=none');
      return settle(1000);
    }).then(function () {
      check('navigation: no rule fits, so every marking is gone',
        [!!document.getElementById('bcb-frame'), !!document.getElementById('bcb-banner'),
          !!document.querySelector('[data-bcb-ribbon]'), !!document.querySelector('link[data-bcb-favicon]')],
        [false, false, false, false]);
      check('navigation: title and ribbon text are BC\'s own again',
        [document.title, brandText()], ['BCBuddy core', 'Dynamics 365 Business Central']);
      // Browser Back fires popstate, which wakes a page that went idle.
      history.replaceState(null, '', BASE);
      window.dispatchEvent(new PopStateEvent('popstate'));
      return settle(300);
    }).then(function () {
      check('navigation: Back to a matching address marks it again', [bannerText(), frameColor()],
        ['NAVBASE', 'rgb(0, 102, 0)']);
    }, function (err) {
      history.replaceState(null, '', BASE);
      throw err;
    });
  }

  function restoreSeed() {
    history.replaceState(null, '', BASE);
    return useSettings(JSON.parse(JSON.stringify(SEED)));
  }

  /* ---- DOM effects from the content script ------------------------------- */
  setTimeout(function () {
    var brand = document.querySelector('[data-bcb-brand]');
    truthy('DOM: brand element found', !!brand);
    if (brand) {
      check('DOM: ribbon text rewritten', brand.textContent, 'Dynamics 365 Business Central - GEMARKEERD (HARNESS)');
      check('DOM: original text preserved', brand.getAttribute('data-bcb-orig'), 'Dynamics 365 Business Central');
    }
    var band = document.querySelector('[data-bcb-ribbon]');
    truthy('DOM: ribbon band found', !!band);
    if (band) {
      check('DOM: band is the full header', band.id, 'fakeHeader');
      check('DOM: band gets rule color', getComputedStyle(band).backgroundColor, 'rgb(0, 102, 0)');
      check('DOM: readable text color', getComputedStyle(band).color, 'rgb(255, 255, 255)');
    }

    // No more black blocks between the icons on the right in the ribbon.
    check('DOM: ribbon button keeps no own background',
      getComputedStyle(document.querySelector('.hdr-btn')).backgroundColor, 'rgba(0, 0, 0, 0)');
    check('DOM: background BC sets on element too',
      getComputedStyle(document.querySelectorAll('.hdr-btn')[1]).backgroundColor, 'rgba(0, 0, 0, 0)');
    check('DOM: input field stays readable',
      getComputedStyle(document.querySelector('.hdr-search')).backgroundColor, 'rgb(255, 255, 255)');
    truthy('DOM: avatar keeps its image',
      getComputedStyle(document.querySelector('.hdr-avatar')).backgroundImage.indexOf('logo.svg') !== -1);
    var frame = document.getElementById('bcb-frame');
    // This harness is not a businesscentral.dynamics.com address. That it still
    // renders is exactly what an on-prem installation needs.
    check('DOM: this is not a BC host', BCBuddy.parseUrl(location.href).isbc, false);
    truthy('DOM: frame drawn outside BC host too', !!frame);
    if (frame) check('DOM: frame width', getComputedStyle(frame).borderTopWidth, '5px');

    var banner = document.getElementById('bcb-banner');
    truthy('DOM: banner drawn', !!banner);
    if (banner) {
      check('DOM: banner is a corner ribbon', banner.className, 'bcb-corner bcb-corner--top-right');
      check('DOM: banner text', banner.textContent, 'HARNESS');
    }
    check('DOM: tab title changed', document.title, '[HARNESS] BCBuddy core');
    truthy('DOM: favicon replaced', !!document.querySelector('link[data-bcb-favicon]'));

    // idempotent: running again must not break anything
    var before = brand ? brand.textContent : '';
    document.body.appendChild(document.createElement('span')); // triggers the observer
    setTimeout(function () {
      var again = document.querySelector('[data-bcb-brand]');
      check('DOM: idempotent after DOM change', again ? again.textContent : '', before);
      check('DOM: no duplicate frames', document.querySelectorAll('#bcb-frame').length, 1);
      check('DOM: no duplicate banners', document.querySelectorAll('#bcb-banner').length, 1);

      // This harness does not run on a BC host, like an on-prem installation.
      // Because a ribbon was found here once, it is picked up again immediately
      // after a redraw — the brake on searching only applies as long as no
      // ribbon has ever been seen.
      // A button that appears in the ribbon after the first pass must lose its
      // background too. The walk remembers which elements paint nothing so it
      // can skip them; a node it has never seen must not be skipped with them.
      var late = document.createElement('button');
      late.type = 'button';
      late.className = 'hdr-btn';
      late.textContent = '+';
      document.querySelector('.hdr-icons').appendChild(late);

      var mark = document.querySelector('[data-bcb-brand]');
      if (mark) mark.removeAttribute('data-bcb-brand');
      document.body.appendChild(document.createElement('span'));
      setTimeout(function () {
        truthy('DOM: on-prem ribbon found again after redraw',
          !!document.querySelector('[data-bcb-brand]'));
        check('DOM: button added later also loses its background',
          getComputedStyle(late).backgroundColor, 'rgba(0, 0, 0, 0)');

        dropdownDom().then(null, function (err) {
          results.push('FAIL  dropdown DOM: ' + err.message);
        }).then(calmDom).then(null, function (err) {
          results.push('FAIL  animations DOM: ' + err.message);
        }).then(copyDom).then(null, function (err) {
          results.push('FAIL  copy values DOM: ' + err.message);
        }).then(newTabFlowDom).then(null, function (err) {
          results.push('FAIL  new tab flow DOM: ' + err.message);
        }).then(gearDom).then(null, function (err) {
          results.push('FAIL  gear menu DOM: ' + err.message);
        }).then(shortcutsDom).then(null, function (err) {
          results.push('FAIL  shortcuts DOM: ' + err.message);
        }).then(bannerPositionsDom).then(null, function (err) {
          results.push('FAIL  banner DOM: ' + err.message);
        }).then(longNameDom).then(null, function (err) {
          results.push('FAIL  long name DOM: ' + err.message);
        }).then(manyRulesDom).then(null, function (err) {
          results.push('FAIL  many rules DOM: ' + err.message);
        }).then(navigationDom).then(null, function (err) {
          results.push('FAIL  navigation DOM: ' + err.message);
        }).then(languageOverride).then(null, function (err) {
          results.push('FAIL  language override: ' + err.message);
        }).then(restoreSeed).then(function () {
          var failed = results.filter(function (line) { return line.indexOf('FAIL') === 0; });
          document.getElementById('results').textContent =
            results.join('\n') + '\n\nTOTAL: ' + results.length + ' checks, ' + failed.length + ' failed.';
          document.title = failed.length ? 'FAILED' : 'ALL PASS';
        });
      }, 500);
    }, 500);
  }, 400);
})();
</script>
</body>
</html>
