<!DOCTYPE html>
<html lang="nl">
<head>

  #fakeHeader { position: fixed; top: 0; left: 0; width: 100%; height: 40px; background: #1f1f1f; color: #fff; display: flex; align-items: center; gap: 20px; padding: 0 12px; box-sizing: border-box; }

  .hdr-icons { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .hdr-btn { background: #2b2b2b; color: #fff; border: 0; padding: 4px 8px; }
  .hdr-search { background: #ffffff; color: #1f1f1f; border: 0; padding: 3px 6px; }
  .hdr-avatar { width: 22px; height: 22px; border-radius: 50%; background-color: #2b2b2b; background-image: url("../icons/logo.svg"); background-size: cover; }

<body>
  <div id="fakeHeader">
    <div class="hdr-inner">
      <a href="#"><span class="brand-text">Dynamics 365 Business Central</span></a>
    </div>
    <span class="env-chip">Environment: Sandbox</span>
    <!-- Icons on the right, as BC renders them: buttons with their own dark
         background, a search field, and an avatar with an image. -->
    <span class="hdr-icons">
      <button type="button" class="hdr-btn">?</button>
      <button type="button" class="hdr-btn" style="background-color: #2b2b2b !important">!</button>
      <input type="text" class="hdr-search" value="zoek">
      <span class="hdr-avatar"></span>
    </span>
  </div>
  <div id="results">running...</div>

<script>
/* ---- chrome API stub ---------------------------------------------------- */
var STORE = {};
/*
 * chrome.i18n with the real messages from _locales/nl. Loaded synchronously
 * so the scripts below can use them immediately.
 */
var MESSAGES = (function () {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../_locales/nl/messages.json', false);
    xhr.send();
    return JSON.parse(xhr.responseText);
  } catch (e) {
    return {};
  }
})();

function i18nStub() {
  return {
    getUILanguage: function () { return 'nl'; },
    getMessage: function (key, subs) {
      var entry = MESSAGES[key];
      if (!entry) return '';
      var message = entry.message;
      (subs || []).forEach(function (value, index) {
        message = message.split('$' + (index + 1)).join(value);
      });
      return message;
    }
  };
}
window.chrome = {
  i18n: i18nStub(),
  storage: {
    local: {
      get: function (keys) {
        var out = {};
        (typeof keys === 'string' ? [keys] : keys).forEach(function (k) {
          if (STORE[k] !== undefined) out[k] = STORE[k];
        });
        return Promise.resolve(out);
      },
      set: function (obj) { Object.keys(obj).forEach(function (k) { STORE[k] = obj[k]; }); return Promise.resolve(); },
      remove: function () { return Promise.resolve(); }
    },
    onChanged: { addListener: function () {} }
  },
  runtime: { sendMessage: function () { return Promise.resolve({}); }, onMessage: { addListener: function () {} } }
};
</script>

<script src="../src/lib/i18n.js"></script>
<script src="../src/lib/match.js"></script>
<script src="../src/lib/settings.js"></script>

<script>
/* ---- seed settings for the content script ------------------------------- */
var BCBuddy = window.BCBuddy;
/*
 * Display lives in a layout here, and the rule deliberately has different own
 * settings beside it. Everything the content script draws below therefore
 * demonstrably comes from the layout.
 */
STORE[BCBuddy.STORAGE_KEY] = BCBuddy.normalize({
  enabled: true,
  layouts: [BCBuddy.normalizeLayout({
    id: 'lay-core',
    name: 'Harness',
    ribbon: { enabled: true, text: 'Dynamics 365 Business Central - GEMARKEERD ({name})' },
    border: { enabled: true, width: 5 },
    banner: { enabled: true, position: 'top-right', text: '{name}' },
    title: { enabled: true, text: '[{name}] {title}' },
    favicon: { enabled: true }
  })],
  rules: [BCBuddy.normalizeRule({
    name: 'HARNESS',
    color: '#006600',
    layoutId: 'lay-core',
    conditions: [{ field: 'url', op: 'contains', value: 'test-core' }],
    ribbon: { enabled: true, text: 'EIGEN TEKST DIE NIET MAG WINNEN' },
    border: { enabled: true, width: 1 },
    banner: { enabled: false }
  })]
});
</script>

<script src="../src/content/content.js"></script>

<script>
(function () {
  var results = [];
  function check(name, actual, expected) {
    var ok = JSON.stringify(actual) === JSON.stringify(expected);
    results.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok ? '' : '\n        expected: ' + JSON.stringify(expected) + '\n        got: ' + JSON.stringify(actual)));
  }
  function truthy(name, actual) {
    results.push((actual ? 'PASS  ' : 'FAIL  ') + name + (actual ? '' : '  (got: ' + JSON.stringify(actual) + ')'));
  }

  var SAAS = 'https://businesscentral.dynamics.com/453d817a-d5b1-49c1-bdcf-d9474180a702/Sandbox?company=CRONUS%20BE&page=1&dc=0&bookmark=B_TwAAAAJ7';
  var ONPREM = 'https://bc-server.local:8080/BC240/?company=CRONUS%20Belgium&tenant=default';

  var saas = BCBuddy.parseUrl(SAAS);
  check('parseUrl SaaS: environment', saas.environment, 'Sandbox');
  check('parseUrl SaaS: company', saas.company, 'CRONUS BE');
  check('parseUrl SaaS: tenant', saas.tenant, '453d817a-d5b1-49c1-bdcf-d9474180a702');
  check('parseUrl SaaS: host', saas.host, 'businesscentral.dynamics.com');
  check('parseUrl SaaS: isbc', saas.isbc, true);
  check('parseUrl SaaS: url decoded', saas.url.indexOf('CRONUS BE') !== -1, true);

  var onprem = BCBuddy.parseUrl(ONPREM);
  check('parseUrl onprem: server instance as environment', onprem.environment, 'BC240');
  check('parseUrl onprem: tenant from query', onprem.tenant, 'default');
  check('parseUrl onprem: company', onprem.company, 'CRONUS Belgium');
  check('parseUrl onprem: isbc', onprem.isbc, false);

  /*
   * Shapes from Microsoft's documentation:
   * https://<host>[/<aadtenantid>][/<environmentname>]/?[company=..]&[tenant=..]
   * Tenant and environment are both optional, and the tenant can be a GUID or a
   * domain name. On-prem puts the server instance where the environment would be,
   * and the tenant comes from the query.
   */
  function velden(url) {
    var c = BCBuddy.parseUrl(url);
    return [c.tenant, c.environment, c.company];
  }
  check('URL: without tenant and without environment',
    velden('https://businesscentral.dynamics.com/?company=CRONUS%20International%20Ltd.&page=9305'),
    ['', '', 'CRONUS International Ltd.']);
  check('URL: environment without tenant',
    velden('https://businesscentral.dynamics.com/Production/?company=CRONUS%20BE'),
    ['', 'Production', 'CRONUS BE']);
  check('URL: tenant as GUID without environment',
    velden('https://businesscentral.dynamics.com/453d817a-d5b1-49c1-bdcf-d9474180a702/?company=CRONUS%20BE'),
    ['453d817a-d5b1-49c1-bdcf-d9474180a702', '', 'CRONUS BE']);
  check('URL: tenant as domain name with environment',
    velden('https://businesscentral.dynamics.com/contoso.onmicrosoft.com/Sandbox/?company=CRONUS%20BE'),
    ['contoso.onmicrosoft.com', 'Sandbox', 'CRONUS BE']);
  check('URL: on-prem with tenant in query',
    velden('https://bc.contoso.local:8080/BC240/?company=CRONUS%20BE&tenant=default'),
    ['default', 'BC240', 'CRONUS BE']);
  check('URL: on-prem without tenant',
    velden('https://localhost:8080/BC/?company=CRONUS'), ['', 'BC', 'CRONUS']);
  check('URL: on-prem without https',
    velden('http://bcserver/BC240/?company=CRONUS%20Belgium&page=21'), ['', 'BC240', 'CRONUS Belgium']);

  check('parseUrl: garbage yields empty context', BCBuddy.parseUrl('niet-een-url').host, '');
  check('parseUrl: no page field anymore',
    Object.prototype.hasOwnProperty.call(saas, 'page'), false);
  check('operators: RegEx is last',
    BCBuddy.OPERATORS.map(function (o) { return o.value; }),
    ['contains', 'equals', 'startsWith', 'endsWith', 'notContains', 'regex']);
  check('fields: page is no longer a choice',
    BCBuddy.FIELDS.map(function (f) { return f.value; }),
    ['environment', 'company', 'tenant', 'url']);
  check('template: {page} is no longer a token',
    BCBuddy.render('{page}', saas, {}), '{page}');

  // matching
  var r = function (conds) { return BCBuddy.normalizeRule({ name: 'x', conditions: conds }); };
  check('match: value somewhere in URL', BCBuddy.matchRule(r([{ field: 'url', op: 'contains', value: 'Sandbox' }]), saas), true);
  check('match: company with space', BCBuddy.matchRule(r([{ field: 'company', op: 'equals', value: 'cronus be' }]), saas), true);
  check('match: AND, both true', BCBuddy.matchRule(r([
    { field: 'environment', op: 'contains', value: 'sand' },
    { field: 'company', op: 'contains', value: 'CRONUS' }]), saas), true);
  check('match: AND, one false', BCBuddy.matchRule(r([
    { field: 'environment', op: 'contains', value: 'sand' },
    { field: 'company', op: 'contains', value: 'CONTOSO' }]), saas), false);
  check('match: regex', BCBuddy.matchRule(r([{ field: 'environment', op: 'regex', value: '^sand(box)?$' }]), saas), true);
  check('match: invalid regex fails without crash', BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '[' }]), saas), false);
  check('match: nested quantifiers fail closed',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: '(a+)+' }]), saas), false);
  check('match: oversized regex fails closed',
    BCBuddy.matchRule(r([{ field: 'url', op: 'regex', value: new Array(202).join('a') }]), saas), false);
  check('match: not contains', BCBuddy.matchRule(r([{ field: 'environment', op: 'notContains', value: 'prod' }]), saas), true);
  check('match: empty value never matches', BCBuddy.matchRule(r([{ field: 'url', op: 'contains', value: '' }]), saas), false);
  check('match: disabled rule', BCBuddy.matchRule(BCBuddy.normalizeRule({ enabled: false, conditions: [{ field: 'url', op: 'contains', value: 'Sandbox' }] }), saas), false);

  // does a rule target Business Central?
  var bc = function (conds) { return BCBuddy.targetsBusinessCentral(BCBuddy.normalizeRule({ conditions: conds })); };
  check('BC rule: condition on environment', bc([{ field: 'environment', op: 'contains', value: 'Sandbox' }]), true);
  check('BC rule: condition on company', bc([{ field: 'company', op: 'contains', value: 'CRONUS' }]), true);
  check('BC rule: empty environment condition counts too',
    bc([{ field: 'environment', op: 'contains', value: '' }]), true);
  check('BC rule: host with BC host',
    bc([{ field: 'host', op: 'equals', value: 'businesscentral.dynamics.com' }]), true);
  check('BC rule: URL with BC host',
    bc([{ field: 'url', op: 'contains', value: 'https://businesscentral.dynamics.com/453d817a' }]), true);
  check('BC rule: RegEx with escaped dots',
    bc([{ field: 'url', op: 'regex', value: 'businesscentral\\.dynamics\\.com/.*' }]), true);
  check('BC rule: other host does not count',
    bc([{ field: 'host', op: 'equals', value: 'portal.azure.com' }]), false);
  check('BC rule: tenant alone does not count',
    bc([{ field: 'tenant', op: 'equals', value: '453d817a-d5b1-49c1-bdcf-d9474180a702' }]), false);
  check('BC rule: one of multiple conditions suffices',
    bc([{ field: 'host', op: 'equals', value: 'intranet.local' },
        { field: 'company', op: 'contains', value: 'CRONUS' }]), true);

  // draft for a new rule, derived from a URL
  var bcDraft = BCBuddy.draftFromContext(saas);
  check('new rule: name from environment', bcDraft.name, 'SANDBOX');
  check('new rule: environment and company from BC URL', bcDraft.conditions,
    [{ field: 'environment', op: 'equals', value: 'Sandbox' },
     { field: 'company', op: 'equals', value: 'CRONUS BE' }]);

  var googleDraft = BCBuddy.draftFromContext(BCBuddy.parseUrl('https://www.google.com/shopping'));
  check('new rule: full URL for non-BC site', googleDraft.conditions,
    [{ field: 'url', op: 'contains', value: 'https://www.google.com/shopping' }]);
  check('new rule: name for non-BC site', googleDraft.name, 'SHOPPING');

  var hostOnly = BCBuddy.draftFromContext(BCBuddy.parseUrl('https://intranet.local/'));
  check('new rule: name falls back to host', hostOnly.name, 'INTRANET.LOCAL');
  check('new rule: without URL an empty condition',
    BCBuddy.draftFromContext(BCBuddy.parseUrl('')).conditions,
    [{ field: 'environment', op: 'contains', value: '' }]);
  check('new rule: without URL a neutral name',
    BCBuddy.draftFromContext(BCBuddy.parseUrl('')).name, 'NIEUWE REGEL');

  // layouts: display separate from the rule
  var layout = BCBuddy.normalizeLayout({
    id: 'lay-1', name: 'Standaard',
    ribbon: { enabled: true, text: 'LAYOUT {environment}' },
    border: { enabled: true, width: 4 },
    banner: { enabled: true, position: 'bottom-left', text: 'uit de layout' },
    title: { enabled: true, text: 'L {title}' },
    favicon: { enabled: true, text: 'LA' }
  });
  var gekoppeld = BCBuddy.normalizeRule({
    name: 'TEST', color: '#c4314b', layoutId: 'lay-1',
    conditions: [{ field: 'environment', op: 'contains', value: 'Sandbox' }],
    ribbon: { enabled: false, text: 'EIGEN TEKST' },
    border: { enabled: true, width: 2 }
  });

  check('layout: has no color', Object.prototype.hasOwnProperty.call(layout, 'color'), false);
  check('layout: without choice rule follows the only layout',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({ ribbon: { text: 'EIGEN' } }), [layout]).ribbon.text,
    'LAYOUT {environment}');
  check('layout: without choice rule follows first layout',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({ ribbon: { text: 'EIGEN' } }),
      [layout, BCBuddy.normalizeLayout({ id: 'lay-2', name: 'Tweede' })]).ribbon.text,
    'LAYOUT {environment}');
  check('layout: missing layout falls back to first',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({ layoutId: 'bestaat-niet', ribbon: { text: 'EIGEN' } }),
      [layout]).ribbon.text, 'LAYOUT {environment}');
  check('layout: without layouts rule stays itself',
    BCBuddy.resolveRule(BCBuddy.normalizeRule({ ribbon: { text: 'EIGEN' } }), []).ribbon.text, 'EIGEN');

  var opgelost = BCBuddy.resolveRule(gekoppeld, [layout]);
  check('layout: ribbon comes from layout', opgelost.ribbon.text, 'LAYOUT {environment}');
  check('layout: border comes from layout', opgelost.border.width, 4);
  check('layout: banner comes from layout', opgelost.banner.position, 'bottom-left');
  check('layout: title comes from layout', opgelost.title.text, 'L {title}');
  check('layout: favicon enabled comes from layout', opgelost.favicon.enabled, true);
  check('layout: favicon letters stay from rule', opgelost.favicon.text, '');
  check('layout: layout carries no letters itself', layout.favicon.text, '');
  check('layout: name stays from rule', opgelost.name, 'TEST');
  check('layout: color stays from rule', opgelost.color, '#c4314b');
  check('layout: conditions stay from rule', opgelost.conditions.length, 1);
  check('layout: rule itself is not modified', gekoppeld.ribbon.text, 'EIGEN TEKST');
  check('layout: unknown layout falls back to rule',
    BCBuddy.resolveRule(gekoppeld, []).border.width, 2);

  var metLayout = BCBuddy.normalize({
    rules: [gekoppeld],
    layouts: [layout]
  });
  check('layout: effective rules are resolved',
    BCBuddy.effectiveRules(metLayout)[0].border.width, 4);
  check('layout: stored in settings', metLayout.layouts.length, 1);

  // shared rules look at shared layouts first
  var gedeeld = BCBuddy.normalize({
    hosted: {
      rules: [BCBuddy.normalizeRule({ name: 'GEDEELD', layoutId: 'lay-h' })],
      layouts: [BCBuddy.normalizeLayout({ id: 'lay-h', name: 'Gedeeld', border: { width: 2 } })]
    }
  });
  check('layout: shared rule uses shared layout',
    BCBuddy.effectiveRules(gedeeld)[0].border.width, 2);

  // first match wins, own rules before shared
  var settings = BCBuddy.normalize({
    rules: [BCBuddy.normalizeRule({ name: 'EIGEN', conditions: [{ field: 'environment', op: 'contains', value: 'sandbox' }] })],
    hosted: { rules: [BCBuddy.normalizeRule({ name: 'GEDEELD', conditions: [{ field: 'url', op: 'contains', value: 'businesscentral' }] })] }
  });
  check('priority: own rule beats shared', BCBuddy.findRule(BCBuddy.effectiveRules(settings), saas).name, 'EIGEN');

  // templates
  var tpl = 'Dynamics 365 Business Central - {environment} - {company} ({name})';
  check('template: full ribbon text',
    BCBuddy.renderTidy(tpl, saas, { name: 'TEST' }),
    'Dynamics 365 Business Central - Sandbox - CRONUS BE (TEST)');
  var noCompany = BCBuddy.parseUrl('https://businesscentral.dynamics.com/453d817a-d5b1-49c1-bdcf-d9474180a702/Sandbox');
  check('template: empty company leaves no clutter',
    BCBuddy.renderTidy(tpl, noCompany, { name: 'TEST' }),
    'Dynamics 365 Business Central - Sandbox (TEST)');
  check('template: empty token between dashes keeps one dash',
    BCBuddy.renderTidy('D365 - {company} - {name}', noCompany, { name: 'TEST' }),
    'D365 - TEST');
  check('template: only empty tokens yields empty text',
    BCBuddy.renderTidy('{company} ({company})', noCompany, {}), '');
  check('template: empty token at start',
    BCBuddy.renderTidy('{company} - {environment}', noCompany, {}), 'Sandbox');
  check('color: text on green', BCBuddy.idealText('#107c10'), '#ffffff');
  check('color: text on blue', BCBuddy.idealText('#0f6cbd'), '#ffffff');
  check('color: text on white', BCBuddy.idealText('#ffffff'), '#000000');
  check('template: {env} alias', BCBuddy.renderTidy('{env}', saas, {}), 'Sandbox');
  check('template: unknown token stays', BCBuddy.render('{zzz}', saas, {}), '{zzz}');
  check('template: {brand} is no longer a token', BCBuddy.render('{brand}', saas, {}), '{brand}');
  check('template: {host} is no longer a token', BCBuddy.render('{host}', saas, {}), '{host}');
  check('template: only listed tokens are replaced',
    BCBuddy.render('{url} {path} {isbc} {rawurl}', saas, {}), '{url} {path} {isbc} {rawurl}');
  check('template: supported tokens',
    BCBuddy.TOKENS, ['name', 'environment', 'env', 'company', 'tenant', 'title']);
  check('template: all supported tokens replaced',
    BCBuddy.render('{name}|{environment}|{env}|{company}|{tenant}|{title}', saas,
      { name: 'TEST', title: 'Company Information' }),
    'TEST|Sandbox|Sandbox|CRONUS BE|453d817a-d5b1-49c1-bdcf-d9474180a702|Company Information');
  check('migration: old {brand} in rule becomes brand name',
    BCBuddy.normalizeRule({ ribbon: { text: '{brand} - {environment}' } }).ribbon.text,
    'Dynamics 365 Business Central - {environment}');
  check('defaults: ribbon text with literal brand name', BCBuddy.normalizeRule({}).ribbon.text,
    'Dynamics 365 Business Central - {company} ({environment})');
  check('advanced: no settings block anymore',
    Object.prototype.hasOwnProperty.call(BCBuddy.normalize(null), 'advanced'), false);

  // leading or trailing spaces in a text value are always accidental
  var metSpaties = BCBuddy.normalizeRule({
    name: '  PROD  ',
    conditions: [{ field: 'company', op: 'equals', value: '  CRONUS BE ' }],
    ribbon: { text: ' {company} ' }
  });
  check('trim: name without spaces', metSpaties.name, 'PROD');
  check('trim: condition without spaces', metSpaties.conditions[0].value, 'CRONUS BE');
  check('trim: ribbon text without spaces', metSpaties.ribbon.text, '{company}');
  check('trim: shared file URL too',
    BCBuddy.normalize({ hosted: { url: '  https://voorbeeld.be/x.json ' } }).hosted.url,
    'https://voorbeeld.be/x.json');

  // colors
  check('color: rgba to hex', BCBuddy.toHex('rgba(188,0,0,1)'), '#bc0000');
  check('color: short hex', BCBuddy.toHex('#fc0'), '#ffcc00');
  check('color: text on dark', BCBuddy.idealText('#bc0000'), '#ffffff');
  check('color: text on light', BCBuddy.idealText('#eaa300'), '#000000');
  check('color: rgba with opacity', BCBuddy.toRgba('#bc0000', 0.5), 'rgba(188,0,0,0.5)');

  // normalization and import/export
  var def = BCBuddy.normalize(null);
  check('defaults: no rules', def.rules.length, 0);
  check('defaults: there is always a layout', def.layouts.length, 1);
  check('defaults: it is named Default', def.layouts[0].name, 'Default');
  check('defaults: with a fixed id', def.layouts[0].id, 'default');
  check('defaults: extension enabled', def.enabled, true);
  check('defaults: shared config is off', def.hosted.active, false);
  check('sync: daily interval', BCBuddy.SYNC_INTERVAL_MINUTES, 1440);
  check('hosted: cannot be active without URL',
    BCBuddy.normalize({ hosted: { active: true } }).hosted.active, false);
  check('hosted: URL without first sync stays off',
    BCBuddy.normalize({ hosted: { url: 'https://x.be/b.json' } }).hosted.active, false);
  check('hosted: once on stays on',
    BCBuddy.normalize({ hosted: { url: 'https://x.be/b.json', active: true } }).hosted.active, true);
  check('hosted: turned off stays off',
    BCBuddy.normalize({ hosted: { url: 'https://x.be/b.json', active: false } }).hosted.active, false);
  check('hosted: legacy autoSync switch is adopted',
    BCBuddy.normalize({ hosted: { url: 'https://x.be/b.json', autoSync: true } }).hosted.active, true);
  check('hosted: legacy interval 0 means off',
    BCBuddy.normalize({ hosted: { url: 'https://x.be/b.json', intervalMinutes: 0 } }).hosted.active, false);
  check('hosted: older interval means on',
    BCBuddy.normalize({ hosted: { url: 'https://x.be/b.json', intervalMinutes: 10080 } }).hosted.active, true);
  check('hosted: legacy switch is not kept around',
    Object.prototype.hasOwnProperty.call(def.hosted, 'autoSync'), false);
  check('sync: no interval in settings anymore',
    Object.prototype.hasOwnProperty.call(def.hosted, 'intervalMinutes'), false);
  check('normalization: default border width', BCBuddy.normalizeRule({}).border.width, 3);
  check('normalization: banner default half transparent',
    BCBuddy.normalizeLayout({}).banner.opacity, 0.5);
  check('normalization: saved opacity is kept',
    BCBuddy.normalizeLayout({ banner: { opacity: 0.8 } }).banner.opacity, 0.8);
  check('normalization: favicon letters capped at two',
    BCBuddy.normalizeRule({ favicon: { text: 'ABCD' } }).favicon.text, 'AB');
  check('normalization: default width', BCBuddy.normalizeRule({}).border.width, 3);
  check('normalization: width capped', BCBuddy.normalizeRule({ border: { width: 999 } }).border.width, 5);
  check('normalization: width at least 1', BCBuddy.normalizeRule({ border: { width: 0 } }).border.width, 1);
  check('normalization: no opacity on border anymore',
    Object.prototype.hasOwnProperty.call(BCBuddy.normalizeRule({}).border, 'opacity'), false);
  check('normalization: unknown position falls back', BCBuddy.normalizeRule({ banner: { position: 'zijkant' } }).banner.position, 'bottom');
  check('normalization: top bar position no longer exists', BCBuddy.normalizeRule({ banner: { position: 'top' } }).banner.position, 'bottom');
  check('normalization: corner position preserved', BCBuddy.normalizeRule({ banner: { position: 'bottom-left' } }).banner.position, 'bottom-left');
  check('normalization: empty rule gets a condition', BCBuddy.normalizeRule({}).conditions.length, 1);

  var exported = BCBuddy.toExport(settings, 'Bedrijf X');
  var roundtrip = BCBuddy.parseImport(JSON.stringify(exported));
  check('export/import: rule count', roundtrip.rules.length, 1);
  check('export/import: name preserved', roundtrip.name, 'Bedrijf X');
  check('export/import: rule name preserved', roundtrip.rules[0].name, 'EIGEN');
  check('import: bare array works', BCBuddy.parseImport('[{"name":"A","conditions":[{"field":"url","op":"contains","value":"x"}]}]').rules[0].name, 'A');
  var importError = '';
  try { BCBuddy.parseImport('{"foo":1}'); } catch (e) { importError = e.message; }
  truthy('import: clear error for wrong file', importError.indexOf('rules') !== -1);
  importError = '';
  try { BCBuddy.parseImport('{niet json'); } catch (e) { importError = e.message; }
  truthy('import: clear error for invalid JSON', importError.indexOf('Ongeldige JSON') === 0);

  // merge on import
  function ruleNamed(name, extra) {
    return BCBuddy.normalizeRule({
      id: (extra && extra.id) || 'id-' + name,
      name: name,
      color: (extra && extra.color) || '#c4314b',
      conditions: [{ field: 'environment', op: 'contains', value: name }]
    });
  }
  var bestaand = [ruleNamed('config 1'), ruleNamed('config 3'), ruleNamed('config 5')];
  var bestand = [
    ruleNamed('config 1', { color: '#107c10' }),
    ruleNamed('config 2'),
    ruleNamed('config 3', { color: '#107c10' })
  ];
  var merged = BCBuddy.mergeRules(bestaand, bestand);
  check('import: all rules present',
    merged.rules.map(function (r) { return r.name; }),
    ['config 1', 'config 3', 'config 5', 'config 2']);
  check('import: existing rule overwritten', merged.rules[0].color, '#107c10');
  check('import: non-imported rule unchanged', merged.rules[2].color, '#c4314b');
  check('import: stats', merged.stats, { overwritten: 2, added: 1, kept: 1 });

  var opNaam = BCBuddy.mergeRules(
    [BCBuddy.normalizeRule({ id: 'lokaal', name: 'TEST', color: '#c4314b' })],
    [BCBuddy.normalizeRule({ id: 'gedeeld', name: ' test ', color: '#0f6cbd' })]);
  check('import: match by name when id differs', opNaam.rules.length, 1);
  check('import: adopts id from file', opNaam.rules[0].id, 'gedeeld');
  check('import: color from file', opNaam.rules[0].color, '#0f6cbd');

  // layouts travel along in import and export
  var metLayoutExport = BCBuddy.toExport(BCBuddy.normalize({ rules: [gekoppeld], layouts: [layout] }));
  check('export: layouts included', metLayoutExport.layouts.length, 1);
  check('export: link preserved', metLayoutExport.rules[0].layoutId, 'lay-1');

  var heen = BCBuddy.parseImport(JSON.stringify(metLayoutExport));
  check('import: layouts read', heen.layouts.length, 1);
  check('import: link read', heen.rules[0].layoutId, 'lay-1');
  check('import: bare rule array without layouts', BCBuddy.parseImport('[]').layouts, []);

  var samengevoegd = BCBuddy.mergeLayouts(
    [BCBuddy.normalizeLayout({ id: 'lay-1', name: 'Standaard', border: { width: 3 } })],
    [layout, BCBuddy.normalizeLayout({ id: 'lay-2', name: 'Compact' })]);
  check('import: layout overwritten in place', samengevoegd.layouts[0].border.width, 4);
  check('import: new layout added', samengevoegd.layouts.length, 2);
  check('import: layout stats', samengevoegd.stats, { overwritten: 1, added: 1, kept: 0 });

  check('import: empty import leaves everything',
    BCBuddy.mergeRules(bestaand, []).stats, { overwritten: 0, added: 0, kept: 3 });
  check('import: import into empty list',
    BCBuddy.mergeRules([], bestand).stats, { overwritten: 0, added: 3, kept: 0 });

  check('raw-url: github blob becomes raw',
    BCBuddy.toRawUrl('https://github.com/bedrijf/repo/blob/main/bc-buddy.json'),
    'https://raw.githubusercontent.com/bedrijf/repo/main/bc-buddy.json');
  check('raw-url: raw stays unchanged',
    BCBuddy.toRawUrl('https://raw.githubusercontent.com/b/r/main/x.json'),
    'https://raw.githubusercontent.com/b/r/main/x.json');
  check('hosted-url: https stays as-is',
    BCBuddy.resolveHostedUrl('https://example.com/bc-buddy.json'),
    'https://example.com/bc-buddy.json');
  check('hosted-url: http github blob becomes https raw',
    BCBuddy.resolveHostedUrl('http://github.com/bedrijf/repo/blob/main/bc-buddy.json'),
    'https://raw.githubusercontent.com/bedrijf/repo/main/bc-buddy.json');
  var httpsError = '';
  try { BCBuddy.resolveHostedUrl('http://example.com/bc-buddy.json'); }
  catch (e) { httpsError = e.message; }
  check('hosted-url: http rejected', httpsError, BCBuddy.t('errHttpsOnly'));
  truthy('hosted-url: empty URL is allowed', BCBuddy.hostedUrlAllowed(''));
  check('hosted-url: http is not allowed', BCBuddy.hostedUrlAllowed('http://example.com/x.json'), false);
  truthy('hash: differs for different content', BCBuddy.hash('a') !== BCBuddy.hash('b'));
  truthy('hash: equal for same content', BCBuddy.hash('abc') === BCBuddy.hash('abc'));

  /* ---- DOM effects from the content script ------------------------------- */
  setTimeout(function () {
    var brand = document.querySelector('[data-bcb-brand]');
    truthy('DOM: brand element found', !!brand);
    if (brand) {
      check('DOM: ribbon text rewritten', brand.textContent, 'Dynamics 365 Business Central - GEMARKEERD (HARNESS)');
      check('DOM: original text preserved', brand.getAttribute('data-bcb-orig'), 'Dynamics 365 Business Central');
    }
    var band = document.querySelector('[data-bcb-ribbon]');
    truthy('DOM: ribbon band found', !!band);
    if (band) {
      check('DOM: band is the full header', band.id, 'fakeHeader');
      check('DOM: band gets rule color', getComputedStyle(band).backgroundColor, 'rgb(0, 102, 0)');
      check('DOM: readable text color', getComputedStyle(band).color, 'rgb(255, 255, 255)');
    }

    // No more black blocks between the icons on the right in the ribbon.
    check('DOM: ribbon button keeps no own background',
      getComputedStyle(document.querySelector('.hdr-btn')).backgroundColor, 'rgba(0, 0, 0, 0)');
    check('DOM: background BC sets on element too',
      getComputedStyle(document.querySelectorAll('.hdr-btn')[1]).backgroundColor, 'rgba(0, 0, 0, 0)');
    check('DOM: input field stays readable',
      getComputedStyle(document.querySelector('.hdr-search')).backgroundColor, 'rgb(255, 255, 255)');
    truthy('DOM: avatar keeps its image',
      getComputedStyle(document.querySelector('.hdr-avatar')).backgroundImage.indexOf('logo.svg') !== -1);
    var frame = document.getElementById('bcb-frame');
    // This harness is not a businesscentral.dynamics.com address. That it still
    // renders is exactly what an on-prem installation needs.
    check('DOM: this is not a BC host', BCBuddy.parseUrl(location.href).isbc, false);
    truthy('DOM: frame drawn outside BC host too', !!frame);
    if (frame) check('DOM: frame width', getComputedStyle(frame).borderTopWidth, '5px');

    var banner = document.getElementById('bcb-banner');
    truthy('DOM: banner drawn', !!banner);
    if (banner) {
      check('DOM: banner is a corner ribbon', banner.className, 'bcb-corner bcb-corner--top-right');
      check('DOM: banner text', banner.textContent, 'HARNESS');
    }
    check('DOM: tab title changed', document.title, '[HARNESS] BCBuddy core');
    truthy('DOM: favicon replaced', !!document.querySelector('link[data-bcb-favicon]'));

    // idempotent: running again must not break anything
    var before = brand ? brand.textContent : '';
    document.body.appendChild(document.createElement('span')); // triggers the observer
    setTimeout(function () {
      var again = document.querySelector('[data-bcb-brand]');
      check('DOM: idempotent after DOM change', again ? again.textContent : '', before);
      check('DOM: no duplicate frames', document.querySelectorAll('#bcb-frame').length, 1);
      check('DOM: no duplicate banners', document.querySelectorAll('#bcb-banner').length, 1);

      // This harness does not run on a BC host, like an on-prem installation.
      // Because a ribbon was found here once, it is picked up again immediately
      // after a redraw — the brake on searching only applies as long as no
      // ribbon has ever been seen.
      var mark = document.querySelector('[data-bcb-brand]');
      if (mark) mark.removeAttribute('data-bcb-brand');
      document.body.appendChild(document.createElement('span'));
      setTimeout(function () {
        truthy('DOM: on-prem ribbon found again after redraw',
          !!document.querySelector('[data-bcb-brand]'));

        var failed = results.filter(function (line) { return line.indexOf('FAIL') === 0; });
        document.getElementById('results').textContent =
          results.join('\n') + '\n\nTOTAL: ' + results.length + ' checks, ' + failed.length + ' failed.';
        document.title = failed.length ? 'FAILED' : 'ALL PASS';
      }, 500);
    }, 500);
  }, 400);
})();
</script>
</body>
</html>
