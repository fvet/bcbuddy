<meta charset="utf-8">
<title>BCBuddy options harness</title>

<div id="results">running...</div>
<div id="app"></div>

<script>
var ROOT = '../';
var STORE = {};
var LISTENERS = [];
var SENT = [];

// The options page is in the active tab itself; the button must look further.
var OPTIONS_TAB = { id: 1, url: 'chrome-extension://abcdef/src/options/options.html', active: true, lastAccessed: 300 };
var GOOGLE_TAB = { id: 2, url: 'https://www.google.com/shopping', active: false, lastAccessed: 200 };
var BC_TAB = { id: 3, active: false, lastAccessed: 100,
  url: 'https://businesscentral.dynamics.com/453d817a-d5b1-49c1-bdcf-d9474180a702/Productie?company=CONTOSO%20BE' };
var TABS = [OPTIONS_TAB, GOOGLE_TAB, BC_TAB];

/*
 * chrome.i18n with the real messages from _locales/nl. Loaded synchronously
 * so the scripts below can use them immediately.
 */
var MESSAGES = (function () {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../_locales/nl/messages.json', false);
    xhr.send();
    return JSON.parse(xhr.responseText);
  } catch (e) {
    return {};
  }
})();

function i18nStub() {
  return {
    getUILanguage: function () { return 'nl'; },
    getMessage: function (key, subs) {
      var entry = MESSAGES[key];
      if (!entry) return '';
      var message = entry.message;
      (subs || []).forEach(function (value, index) {
        message = message.split('$' + (index + 1)).join(value);
      });
      return message;
    }
  };
}
window.chrome = {
  i18n: i18nStub(),
  storage: {
    local: {
      get: function (keys) {
        var out = {};
        var list = typeof keys === 'string' ? [keys] : keys;
        list.forEach(function (k) { if (STORE[k] !== undefined) out[k] = STORE[k]; });
        return Promise.resolve(out);
      },
      set: function (obj) {
        var changes = {};
        Object.keys(obj).forEach(function (k) {
          changes[k] = { oldValue: STORE[k], newValue: obj[k] };
          STORE[k] = obj[k];
        });
        LISTENERS.forEach(function (fn) { fn(changes, 'local'); });
        return Promise.resolve();
      },
      remove: function (k) { delete STORE[k]; return Promise.resolve(); }
    },
    onChanged: { addListener: function (fn) { LISTENERS.push(fn); } }
  },
  runtime: {
    sendMessage: function (msg) { SENT.push(msg); return Promise.resolve({ ok: true, count: 3 }); },
    openOptionsPage: function () {},
    onMessage: { addListener: function () {} }
  },
  tabs: {
    query: function () { return Promise.resolve(TABS); },
    onActivated: { addListener: function () {} },
    onUpdated: { addListener: function () {} }
  },
  action: { setBadgeText: function () {}, setBadgeBackgroundColor: function () {}, setBadgeTextColor: function () {} },
  alarms: { create: function () {}, clear: function () {}, onAlarm: { addListener: function () {} } }
};

/*
 * FileReader is asynchronous and does not follow headless Chrome's virtual clock,
 * so the test sometimes looked too early. We replace it with a synchronous version:
 * the path we want to test (the change handler, merging, and redrawing) stays fully real.
 */
var FILE_TEXT = '';
window.FileReader = function () {
  var reader = this;
  this.readAsText = function () {
    reader.result = FILE_TEXT;
    if (reader.onload) reader.onload();
  };
};

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function () { reject(new Error('could not load ' + src)); };
    document.head.appendChild(s);
  });
}

var results = [];
function check(name, actual, expected) {
  var ok = JSON.stringify(actual) === JSON.stringify(expected);
  results.push((ok ? 'PASS  ' : 'FAIL  ') + name +
    (ok ? '' : '\n        expected: ' + JSON.stringify(expected) + '\n        got: ' + JSON.stringify(actual)));
}
function truthy(name, actual) {
  results.push((actual ? 'PASS  ' : 'FAIL  ') + name + (actual ? '' : '  (got: ' + JSON.stringify(actual) + ')'));
}
function report() {
  var failed = results.filter(function (l) { return l.indexOf('FAIL') === 0; });
  document.getElementById('results').textContent =
    results.join('\n') + '\n\nTOTAL: ' + results.length + ' checks, ' + failed.length + ' failed.';
}

/* ---- syntax check of all script files ----------------------------------- */
var FILES = [
  'src/lib/match.js', 'src/lib/settings.js', 'src/content/content.js',
  'src/background.js', 'src/options/options-helpers.js', 'src/options/options-cards.js',
  'src/options/options-hosted.js', 'src/options/options.js', 'src/popup/popup.js'
];

Promise.all(FILES.map(function (f) {
  return fetch(ROOT + f).then(function (r) { return r.text(); }).then(function (text) {
    try {
      new Function(text);
      return 'PASS  syntax: ' + f;
    } catch (e) {
      return 'FAIL  syntax: ' + f + '\n        ' + e.message;
    }
  }, function () { return 'FAIL  syntax: ' + f + ' (not found)'; });
})).then(function (lines) {
  lines.forEach(function (l) { results.push(l); });
  return assertMessages();
}).then(assertBrandMark).then(runOptions).then(report, function (err) {
  results.push('FAIL  harness: ' + err.message);
  report();
});

/* ---- the brand appears three times --------------------------------------
 * logo.svg supplies the PNGs; the options page and popup have the brand inline,
 * because only that way can the tint follow the browser theme.
 * Those two copies can therefore quietly drift from the source.
 * Hence this check on the geometry — not the colors: the fill differs on purpose
 * (var(--brand-mark) versus a fixed tint), as do the ids, which must be unique per document.
 */
function markSignature(svg) {
  function attrs(el, names) {
    return names.map(function (name) {
      return name + '=' + String(el.getAttribute(name) || '').trim().toLowerCase();
    }).join(' ');
  }

  var bite = svg.querySelector('mask circle');
  var text = svg.querySelector('text');

  // The dot sits outside the mask; the circle inside cuts out the bite.
  var dot = null;
  svg.querySelectorAll('circle').forEach(function (circle) {
    if (!dot && !circle.closest('mask')) dot = circle;
  });
  if (!bite || !text || !dot) throw new Error('incomplete brand');

  return [
    'viewBox=' + String(svg.getAttribute('viewBox') || '').trim(),
    'bite ' + attrs(bite, ['cx', 'cy', 'r']),
    'text ' + attrs(text, ['x', 'y', 'text-anchor', 'font-size', 'font-weight', 'letter-spacing']),
    'letters=' + text.textContent.trim(),
    'dot ' + attrs(dot, ['cx', 'cy', 'r', 'fill'])
  ].join(' | ');
}

function assertBrandMark() {
  var sources = ['icons/logo.svg', 'src/options/options.html', 'src/popup/popup.html'];
  return Promise.all(sources.map(function (f) {
    return fetch(ROOT + f).then(function (r) { return r.text(); });
  })).then(function (texts) {
    var parser = new DOMParser();
    var expected = markSignature(parser.parseFromString(texts[0], 'image/svg+xml').documentElement);

    function inlineMark(html, where) {
      var found = null;
      parser.parseFromString(html, 'text/html').querySelectorAll('svg').forEach(function (svg) {
        var text = svg.querySelector('text');
        if (!found && text && text.textContent.trim() === 'BC') found = svg;
      });
      if (!found) throw new Error('no brand found in ' + where);
      return found;
    }

    check('brand: options page matches logo.svg',
      markSignature(inlineMark(texts[1], 'options.html')), expected);
    check('brand: popup matches logo.svg',
      markSignature(inlineMark(texts[2], 'popup.html')), expected);
  });
}

/* ---- translations: everything the code uses must exist ------------------ */
function assertMessages() {
  var sources = FILES.concat(['src/options/options.html', 'src/popup/popup.html', 'manifest.json']);
  return Promise.all([
    fetch(ROOT + '_locales/nl/messages.json').then(function (r) { return r.json(); }),
    fetch(ROOT + '_locales/en/messages.json').then(function (r) { return r.json(); }),
    Promise.all(sources.map(function (f) {
      return fetch(ROOT + f).then(function (r) { return r.text(); });
    }))
  ]).then(function (loaded) {
    var nl = loaded[0];
    var en = loaded[1];
    var code = loaded[2].join('\n');

    check('i18n: nl and en have the same keys',
      Object.keys(nl).sort().filter(function (k) { return !en[k]; })
        .concat(Object.keys(en).sort().filter(function (k) { return !nl[k]; })), []);

    function collect(into, pattern) {
      var match;
      var re = new RegExp(pattern, 'g');
      while ((match = re.exec(code)) !== null) into[match[1]] = true;
    }

    // Definite keys: a message must exist for each of these.
    var used = {};
    collect(used, "\\bt\\('([A-Za-z0-9_]+)'");                                  // t('key')
    collect(used, 'data-i18n(?:-title|-label|-placeholder)?="([A-Za-z0-9_]+)"'); // in the HTML
    collect(used, "key: '([A-Za-z0-9_]+)'");                                     // fields and operators
    collect(used, '__MSG_([A-Za-z0-9_]+)__');                                    // in the manifest

    // Broader: any name that appears in quotes somewhere. Also catches
    // t(condition ? 'a' : 'b'), which the pattern above misses.
    var mentioned = {};
    collect(mentioned, "'([A-Za-z0-9_]+)'");

    var usedKeys = Object.keys(used).sort();
    truthy('i18n: keys are used', usedKeys.length > 40);
    check('i18n: no missing keys',
      usedKeys.filter(function (k) { return !nl[k]; }), []);
    check('i18n: no unused keys',
      Object.keys(nl).sort().filter(function (k) { return !used[k] && !mentioned[k]; }), []);
    check('i18n: every message has text in both languages',
      Object.keys(nl).filter(function (k) {
        return !String(nl[k].message || '').trim() || !String((en[k] || {}).message || '').trim();
      }), []);

    // The Web Store rejects a package whose description is longer than
    // 132 characters — per language, so both files must fit.
    check('i18n: description stays under 132 characters',
      [['nl', nl], ['en', en]].filter(function (pair) {
        return String(pair[1].extDescription.message || '').length > 132;
      }).map(function (pair) { return pair[0]; }), []);
  });
}

/* ---- actually build the options page ----------------------------------- */
function runOptions() {
  STORE.settings = {
    enabled: true,
    rules: [
      {
        id: 'a', name: 'TEST', color: '#bc0000', layoutId: 'lay-1',
        conditions: [{ field: 'environment', op: 'contains', value: 'Sandbox' }]
      },
      {
        id: 'b', name: 'PROD', color: '#107c10', layoutId: 'lay-1',
        conditions: [{ field: 'environment', op: 'equals', value: 'Productie' }]
      }
    ],
    hosted: {
      url: 'https://raw.githubusercontent.com/x/y/main/bc.json',
      active: true,
      sourceName: 'Bedrijf X',
      lastSync: '2026-08-22T09:00:00.000Z',
      rules: [{ id: 'h1', name: 'GEDEELD', color: '#0f6cbd', layoutId: 'hl1',
                 conditions: [{ field: 'url', op: 'contains', value: 'dynamics' }] }],
      layouts: [{ id: 'hl1', name: 'GEDEELDE LAYOUT', border: { enabled: true, width: 5 } }]
    },
    layouts: [
      { id: 'lay-1', name: 'Standaard',
        ribbon: { enabled: true, text: 'Dynamics 365 Business Central - {environment} - {company} ({name})' },
        border: { enabled: true, width: 4 },
        banner: { enabled: true, position: 'top-right', text: '{name}' } },
      { id: 'lay-2', name: 'Compact',
        ribbon: { enabled: true, text: 'LAYOUT {environment}' },
        border: { enabled: true, width: 2 },
        banner: { enabled: true, position: 'bottom-left', text: 'uit de layout' } }
    ]
  };

  return fetch(ROOT + 'src/options/options.html')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
      document.getElementById('app').innerHTML = doc.body.innerHTML;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = ROOT + 'src/options/options.css';
      document.head.appendChild(css);
      return loadScript(ROOT + 'src/lib/i18n.js')
        .then(function () { return loadScript(ROOT + 'src/lib/match.js'); })
        .then(function () { return loadScript(ROOT + 'src/lib/settings.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options-helpers.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options-cards.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options-hosted.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options.js'); });
    })
    .then(function () {
      return new Promise(function (resolve) { setTimeout(resolve, 500); });
    })
    .then(assertOptions);
}

function assertOptions() {

  check('options: document lang follows UI language',
    document.documentElement.lang, 'nl');
  check('options: shared rule rendered', document.querySelectorAll('#hostedList .rule').length, 1);

  var first = cards[0];
  var layoutOne = document.querySelectorAll('#layoutList .rule')[0];
  check('options: name filled in', first.querySelector('.rule__name').value, 'TEST');

  check('options: no preview on a rule anymore', first.querySelector('[data-preview]'), null);
  check('options: ribbon preview text lives on the layout',
    layoutOne.querySelector('[data-preview-brand]').textContent,

  check('options: tooltip on hover there too',
    cards[1].querySelector('[data-match]').title, 'Past niet op de test-URL');
  check('options: banner in layout preview',
    layoutOne.querySelector('[data-preview-banner]').className,
    'preview__banner preview__banner--top-right preview__banner--visible');
  check('options: frame width in layout preview',
    layoutOne.querySelector('[data-preview-frame]').style.borderWidth, '4px');

  // rules start collapsed until you click them
  truthy('options: rules start collapsed', first.classList.contains('rule--collapsed'));
  check('options: no separate collapse arrow on a rule',
    first.querySelector('.rule__toggle'), null);
  truthy('options: color swatch is the toggle',
    first.querySelector('[data-action="toggle"]').classList.contains('rule__swatch'));
  check('options: aria-expanded is false',
    first.querySelector('[data-action="toggle"]').getAttribute('aria-expanded'), 'false');
  check('options: rule on/off uses the same toggle',
    getComputedStyle(first.querySelector('[data-path="enabled"]')).width, '34px');
  truthy('options: name stays visible when collapsed',
    first.querySelector('.rule__name').offsetParent !== null);
  truthy('options: details hidden when collapsed',
    first.querySelector('[data-body]').offsetParent === null);

  first.querySelector('[data-match]').click();
  truthy('options: click on header expands', !first.classList.contains('rule--collapsed'));
  check('options: aria-expanded is true',
    first.querySelector('[data-action="toggle"]').getAttribute('aria-expanded'), 'true');
  truthy('options: details now visible', first.querySelector('[data-body]').offsetParent !== null);

  first.querySelector('[data-action="toggle"]').click();
  truthy('options: click again collapses', first.classList.contains('rule--collapsed'));
  first.querySelector('[data-action="toggle"]').click();

  // own and shared rules are in the same list, shared at the bottom
  check('options: shared rules follow own rules',
    document.getElementById('sharedHead').previousElementSibling.id, 'ruleList');
  check('options: with heading above',
    document.getElementById('hostedList').previousElementSibling.id, 'sharedHead');
  truthy('options: heading shown because shared rules exist',
    !document.getElementById('sharedHead').hidden);
  var sharedHead = document.getElementById('sharedHead');
  sharedHead.hidden = true;
  truthy('options: without shared rules heading is gone',
    sharedHead.offsetParent === null);
  sharedHead.hidden = false;
  check('options: section heading is Rules',
    document.getElementById('addRule').closest('.section-head').querySelector('h2').textContent, 'Regels');
  truthy('options: list no longer inside shared config card',
    !document.getElementById('syncNow').closest('.card').contains(document.getElementById('hostedList')));
  check('options: clear only via cross on shared rules',

  var hostedCard = document.querySelector('#hostedList .rule');
  truthy('options: shared rule is not editable', hostedCard.querySelector('.rule__name').disabled);
  truthy('options: shared rule can expand',

  // shared configuration: no toggles anymore, only a URL and sync
  check('options: no auto-update toggle',

  check('options: no interval choice anymore', document.getElementById('hostedInterval'), null);

  truthy('options: trust warning present',

  hostedUrlField.dispatchEvent(new Event('change'));
  truthy('options: sync re-enabled with https',

  check('options: subtitle no longer says "Environment marker"',

  truthy('options: raw link help removed',

  check('options: no display block on a rule', first.querySelector('[data-display]'), null);

  check('options: and Tab title',
    layoutOne.querySelector('[data-i18n="titleToggle"]').textContent, 'Tabtitel');

  // a rule preview does not show a ribbon on a non-BC site
  var condField = first.querySelector('select[data-cond="field"]');
  var condValue = first.querySelector('input[data-cond="value"]');
  function setCondition(field, value) {
    condField.value = field;
    condField.dispatchEvent(new Event('change', { bubbles: true }));
    condValue.value = value;
    condValue.dispatchEvent(new Event('input', { bubbles: true }));
  }

  setCondition('url', 'intranet.local');
  check('options: condition updated', first.querySelector('[data-cond="value"]').value, 'intranet.local');
  setCondition('environment', 'Sandbox');

  check('options: layout preview shows BC page',
    layoutOne.querySelector('[data-preview-page]').textContent, 'Business Central pagina');
  truthy('options: layout always shows ribbon',
    !layoutOne.querySelector('[data-preview-ribbon]').hidden);

  // help behind the question mark
  var hint = layoutOne.querySelector('.hint[data-action="hint"]');
  truthy('options: question mark beside text field', !!hint);
  truthy('options: help mentions tokens', hint.textContent.indexOf('{environment}') !== -1);
  truthy('options: help no longer mentions {host}', hint.textContent.indexOf('{host}') === -1);
  truthy('options: help no longer mentions {tenant}', hint.textContent.indexOf('{tenant}') === -1);

  truthy('options: click opens help', hint.classList.contains('is-open'));

  truthy('options: click again closes it', !hint.classList.contains('is-open'));

  check('options: token list no longer at page bottom',
    document.querySelector('#app footer'), null);

  // theme: the browser must be able to tint its own controls
  check('options: follows system theme without toggle',

    Array.prototype.map.call(first.querySelector('select[data-cond="field"]').options,
      function (o) { return o.value; }),
    ['environment', 'company', 'tenant', 'url']);
  truthy('options: no page in parsed URL',
    document.getElementById('parsed').textContent.indexOf('Pagina') === -1);

  check('options: parsed test URL shows environment',
    document.getElementById('parsed').textContent.indexOf('Sandbox') !== -1, true);

  // ribbon text is edited on the layout and flows through to the rules

  first = document.querySelectorAll('#ruleList .rule')[0]; // the cards were redrawn

  // pick a color from the palette
  var swatch = first.querySelector('[data-palette] button[data-color="#107c10"]');
  swatch.click();
  check('options: palette color applied',
    first.querySelector('input[type="color"][data-path="color"]').value, '#107c10');

  // the free color picker sits at the end of the palette; the hex field is gone
  var palette = first.querySelector('[data-palette]');
  check('options: color picker after swatches',
    palette.lastElementChild, first.querySelector('input[type="color"][data-path="color"]'));
  check('options: no separate hex field',
    first.querySelector('input[type="text"][data-path="color"]'), null);

  var custom = first.querySelector('input[type="color"][data-path="color"]');
  custom.value = '#123456';
  custom.dispatchEvent(new Event('input', { bubbles: true }));
  check('options: custom color from picker applies to rule',
    first.style.getPropertyValue('--rule-color'), '#123456');
  custom.value = '#107c10';
  custom.dispatchEvent(new Event('input', { bubbles: true }));

  // add and move a rule
  document.getElementById('addRule').click();
  check('options: rule added', document.querySelectorAll('#ruleList .rule').length, 3);

  var added = document.querySelectorAll('#ruleList .rule')[2];
  check('options: new rule takes name from test URL',
    added.querySelector('.rule__name').value, 'SANDBOX');
  check('options: new rule copies environment and company',
    Array.prototype.map.call(added.querySelectorAll('.condition'), function (row) {
      return row.querySelector('[data-cond="field"]').value + ' ' +
        row.querySelector('[data-cond="op"]').value + ' ' +
        row.querySelector('[data-cond="value"]').value;
    }),
    ['environment equals Sandbox', 'company equals CRONUS BE']);
  truthy('options: new rule matches test URL immediately',
    added.querySelector('[data-match]').textContent === '\u2713');
  check('options: new rule gets default layout',
    added.querySelector('[data-layout-picker]').value, 'lay-1');
  check('options: no arrow buttons to move',
    document.querySelector('#ruleList [data-action="up"]'), null);

  // leading or trailing spaces disappear when you leave the field
  var naamVeld = document.querySelectorAll('#ruleList .rule')[0].querySelector('.rule__name');
  var naamWas = naamVeld.value;
  naamVeld.value = '  ' + naamWas + '  ';
  naamVeld.dispatchEvent(new Event('input', { bubbles: true }));
  naamVeld.dispatchEvent(new Event('change', { bubbles: true }));
  check('options: spaces around name trimmed', naamVeld.value, naamWas);

  // without mouse: the grip moves with arrow keys
  var second = document.querySelectorAll('#ruleList .rule')[1];
  second.querySelector('[data-grip]').dispatchEvent(
    new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true, cancelable: true }));
  check('options: rule moved up',
    document.querySelectorAll('#ruleList .rule')[0].querySelector('.rule__name').value, 'PROD');
  var rerendered = document.querySelectorAll('#ruleList .rule');
  truthy('options: expanded rule stays open after redraw',
    !rerendered[1].classList.contains('rule--collapsed'));
  truthy('options: new rule opens immediately',
    !rerendered[2].classList.contains('rule--collapsed'));
  truthy('options: untouched rule stays collapsed',
    rerendered[0].classList.contains('rule--collapsed'));

  // with the mouse: drop the top rule below the last one
  var namen = function () {
    return Array.prototype.map.call(
      document.querySelectorAll('#ruleList .rule .rule__name'), function (i) { return i.value; });
  };
  var voor = namen();
  var dragged = document.querySelectorAll('#ruleList .rule')[0];
  var transfer = new DataTransfer();
  dragged.querySelector('[data-grip]').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
  truthy('options: grip makes card draggable', dragged.draggable);
  dragged.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));

  var laatste = document.querySelectorAll('#ruleList .rule')[voor.length - 1];
  var onderrand = laatste.getBoundingClientRect().bottom - 2;
  laatste.dispatchEvent(new DragEvent('dragover',
    { bubbles: true, cancelable: true, dataTransfer: transfer, clientY: onderrand }));
  truthy('options: target rule shows drop position',
    laatste.classList.contains('rule--drop-after'));
  laatste.dispatchEvent(new DragEvent('drop',
    { bubbles: true, cancelable: true, dataTransfer: transfer, clientY: onderrand }));
  check('options: dragged rule is now at bottom', namen(), voor.slice(1).concat(voor[0]));

  // and back again, so the rest of the test can continue with the old order
  document.querySelectorAll('#ruleList .rule')[voor.length - 1].querySelector('[data-grip]')
    .dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true, cancelable: true }));
  document.querySelectorAll('#ruleList .rule')[voor.length - 2].querySelector('[data-grip]')
    .dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true, cancelable: true }));
  check('options: arrows move them back to top', namen(), voor);

  // add a condition
  var card0 = document.querySelectorAll('#ruleList .rule')[0];
  card0.querySelector('[data-action="add-condition"]').click();
  check('options: condition added', card0.querySelectorAll('.condition').length, 2);

  check('options: no replace vs add choice',
    document.querySelector('input[name="importMode"]'), null);
  check('options: no brand name selector', document.getElementById('brandSelector'), null);
  check('options: no ribbon bar selector', document.getElementById('ribbonSelector'), null);
  check('options: no bold toggle on ribbon',
    layoutOne.querySelector('[data-path="ribbon.bold"]'), null);

  // sync saves first, then messages the service worker
  document.getElementById('syncNow').click();

  // wait until save + message have run (and the earlier debounce has settled)
  return wait(500).then(function () {
    check('options: sync sends message',
      SENT.length > 0 && SENT[SENT.length - 1].type, 'bcb:sync');
    truthy('options: settings saved', !!STORE.settings && STORE.settings.rules.length === 3);
    check('options: save reports nothing',
      document.getElementById('status').textContent, '');
    check('options: saved order', STORE.settings.rules[0].name, 'PROD');
    return assertNav().then(assertLayouts).then(importFile)
      .then(assertParsedUrl).then(assertSharedCopy).then(assertClearShared);
  });
}

/* ---- parsed test URL shows only found values ---------------------------- */
function assertParsedUrl() {
  var input = document.getElementById('testUrl');
  var parsed = document.getElementById('parsed');

  function setUrl(url) {
    input.value = url;
    input.dispatchEvent(new Event('input'));
  }

  setUrl('https://www.google.com/shopping');
  check('URL: only found labels',
    Array.prototype.map.call(parsed.querySelectorAll('dt'), function (dt) { return dt.textContent; }),
    ['Omgeving:']);
  check('URL: corresponding values',
    Array.prototype.map.call(parsed.querySelectorAll('dd'), function (dd) { return dd.textContent; }),
    ['shopping']);

  // a new rule for a non-BC site gets the full URL as a condition
  document.getElementById('addRule').click();
  var cards = document.querySelectorAll('#ruleList .rule');
  var fresh = cards[cards.length - 1];
  check('new rule: name from non-BC test URL',
    fresh.querySelector('.rule__name').value, 'SHOPPING');
  check('new rule: condition on full URL',
    fresh.querySelector('[data-cond="field"]').value + ' ' +
    fresh.querySelector('[data-cond="op"]').value + ' ' +
    fresh.querySelector('[data-cond="value"]').value,
    'url contains https://www.google.com/shopping');
  check('new rule: matches test URL immediately',
    fresh.querySelector('[data-match]').title, 'Past op de test-URL');
  check('new rule: no preview on rule', fresh.querySelector('[data-preview]'), null);

  setUrl('niet-een-url');
  check('URL: message when nothing recognised',
    parsed.textContent, 'Niets herkend in deze URL.');

  setUrl('https://businesscentral.dynamics.com/453d817a-d5b1-49c1-bdcf-d9474180a702/Sandbox?company=CRONUS%20BE');
  check('URL: all four fields on full BC URL',
    Array.prototype.map.call(parsed.querySelectorAll('dt'), function (dt) { return dt.textContent; }),
    ['Omgeving:', 'Bedrijf:', 'Tenant:']);

  return assertTabPicker(input);
}

/* ---- get URL from an open tab ------------------------------------------- */
function assertTabPicker(input) {
  var button = document.getElementById('useCurrentTab');

  button.click();
  return wait(200).then(function () {
    check('tab: ignores options page and picks BC tab', input.value, BC_TAB.url);

    // without a BC tab, the most recently used tab wins
    TABS = [OPTIONS_TAB, GOOGLE_TAB, { id: 4, url: 'https://example.com/', active: false, lastAccessed: 50 }];
    button.click();
    return wait(200);
  }).then(function () {
    check('tab: without BC tab uses most recent tab', input.value, GOOGLE_TAB.url);

    // no usable tab at all
    TABS = [OPTIONS_TAB];
    input.value = 'ongewijzigd';
    button.click();
    return wait(200);
  }).then(function () {
    check('tab: nothing usable leaves test URL unchanged', input.value, 'ongewijzigd');
    check('tab: and reports it',
      document.getElementById('status').textContent, 'Geen open tabblad met een bruikbare URL gevonden.');
    TABS = [OPTIONS_TAB, GOOGLE_TAB, BC_TAB];
  });
}

/* ---- navigation --------------------------------------------------------- */
function assertNav() {
  var items = document.querySelectorAll('.nav__item');
  check('nav: master toggle at bottom of nav',
    document.getElementById('globalEnabled').closest('nav.nav').lastElementChild
      .contains(document.getElementById('globalEnabled')), true);
  check('nav: no longer in top bar',
    document.querySelector('.topbar__actions #globalEnabled'), null);
  check('nav: master toggle is a switch not checkbox',
    getComputedStyle(document.getElementById('globalEnabled')).width, '34px');
  check('nav: three sections',
    Array.prototype.map.call(items, function (b) { return b.dataset.panel; }),
    ['environments', 'settings', 'about']);
  check('nav: each section has an icon',
    Array.prototype.filter.call(items, function (b) { return !!b.querySelector('svg'); }).length, 3);
  check('nav: environments is open',
    items[0].getAttribute('aria-current'), 'page');
  truthy('nav: rules visible', !document.querySelector('.panel[data-panel="environments"]').hidden);
  truthy('nav: settings hidden', document.querySelector('.panel[data-panel="settings"]').hidden);

  items[1].click();
  truthy('nav: settings now visible', !document.querySelector('.panel[data-panel="settings"]').hidden);
  truthy('nav: environments now hidden', document.querySelector('.panel[data-panel="environments"]').hidden);
  check('nav: shared config under settings',
    document.getElementById('syncNow').closest('.panel').dataset.panel, 'settings');
  check('nav: layouts and rules under environments',
    document.getElementById('addLayout').closest('.panel').dataset.panel, 'environments');
  check('nav: clicked section marked', items[1].getAttribute('aria-current'), 'page');
  truthy('nav: choice remembered', STORE.ui && STORE.ui.panel === 'settings');

  items[2].click();
  var about = document.querySelector('.panel[data-panel="about"]');
  truthy('nav: about section no longer called Help',
    items[2].textContent.trim() === 'Over');
  truthy('nav: and explains what the extension does',
    about.querySelector('[data-i18n="aboutIntro"]').textContent.length > 60);
  check('nav: with email address',
    about.querySelector('a[href^="mailto:"]').getAttribute('href'),
    'mailto:frederic.vercaemst@outlook.com');
  check('nav: and link to github',
    about.querySelector('a[href^="https://github.com"]').getAttribute('href'),
    'https://github.com/fvet/bcbuddy');

  items[0].click(); // back; the rest of the test works with the rules
  return Promise.resolve();
}

/* ---- layouts ------------------------------------------------------------ */
function assertLayouts() {
  var cards = document.querySelectorAll('#layoutList .rule');
  check('layout: own layouts rendered', cards.length, 2);
  check('layout: shared layout rendered', document.querySelectorAll('#hostedLayoutList .rule').length, 1);

  var layoutCard = cards[0];
  check('layout: name filled in', layoutCard.querySelector('.rule__name').value, 'Standaard');
  check('layout: no usage counter anymore', layoutCard.querySelector('[data-usage]'), null);
  check('layout: no color palette on layout', layoutCard.querySelector('[data-palette]'), null);
  check('layout: no conditions on layout', layoutCard.querySelector('[data-conditions]'), null);
  check('layout: no favicon letters on layout',
    layoutCard.querySelector('[data-path="favicon.text"]'), null);
  truthy('layout: display block present', !!layoutCard.querySelector('[data-path="ribbon.text"]'));
  check('layout: preview uses layout text',
    cards[1].querySelector('[data-preview-brand]').textContent, 'LAYOUT Sandbox');

  // The first rule here is PROD: earlier steps changed the order.
  // It is linked to 'Standaard' and has color #107c10.
  var ruleCard = document.querySelectorAll('#ruleList .rule')[0];
  var picker = ruleCard.querySelector('[data-layout-picker]');
  check('rule: picker lists own and shared layouts',
    Array.prototype.map.call(picker.options, function (o) { return o.textContent; }),
    ['Standaard', 'Compact']);
  check('rule: no per-rule settings choice', picker.value, 'lay-1');

  picker.value = 'lay-2';
  picker.dispatchEvent(new Event('change', { bubbles: true }));

  check('rule: no preview on rule itself',
    ruleCard.querySelector('[data-preview]'), null);

  return wait(400).then(function () {
    check('layout: link saved', STORE.settings.rules[0].layoutId, 'lay-2');

    var used = document.querySelectorAll('#layoutList .rule')[1];
    check('layout: preview borrows rule color',
      used.querySelector('[data-preview-frame]').style.borderColor, 'rgb(16, 124, 16)');

    // a change in a layout is saved (on the first one, which stays put)
    var width = document.querySelectorAll('#layoutList .rule')[0]
      .querySelector('input[data-path="border.width"]');
    width.value = '5';
    width.dispatchEvent(new Event('input', { bubbles: true }));
    check('layout: field change applied', width.value, '5');

    // add layout
    document.getElementById('addLayout').click();
    check('layout: added', document.querySelectorAll('#layoutList .rule').length, 3);
    check('layout: picker knows new layout',
      document.querySelectorAll('#ruleList .rule')[0].querySelector('[data-layout-picker]').options.length, 3);

    // and remove again: the rule falls back to the first layout
    var confirmed = window.confirm;
    window.confirm = function () { return true; };
    document.querySelectorAll('#layoutList .rule')[1]
      .querySelector('[data-action="delete"]').click();
    window.confirm = confirmed;

    return wait(400);
  }).then(function () {
    check('layout: change saved', STORE.settings.layouts[0].border.width, 5);
    check('layout: removed', document.querySelectorAll('#layoutList .rule').length, 2);
    check('layout: rule falls back to first layout',
      STORE.settings.rules[0].layoutId, 'lay-1');
    check('rule: picker selects first layout',
      document.querySelectorAll('#ruleList .rule')[0]
        .querySelector('[data-layout-picker]').value, 'lay-1');
  });
}

/* ---- copy a shared rule ------------------------------------------------- */
function assertSharedCopy() {
  var before = document.querySelectorAll('#ruleList .rule').length;
  var layoutsBefore = document.querySelectorAll('#layoutList .rule').length;
  var shared = document.querySelector('#hostedList .rule');

  check('shared: no copy-all button anymore', document.getElementById('copyHosted'), null);
  truthy('shared: copy button on rule itself',
    !!shared.querySelector('[data-action="duplicate"]'));
  check('shared: cannot delete', shared.querySelector('[data-action="delete"]'), null);

  shared.querySelector('[data-action="duplicate"]').click();

  return wait(400).then(function () {
    var rules = document.querySelectorAll('#ruleList .rule');
    check('shared: own copy added', rules.length, before + 1);
    check('shared: with same name',
      rules[rules.length - 1].querySelector('.rule__name').value, 'GEDEELD');
    truthy('shared: copy is editable',
      !rules[rules.length - 1].querySelector('.rule__name').disabled);
    check('shared: shared layout copied too',
      document.querySelectorAll('#layoutList .rule').length, layoutsBefore + 1);
    check('shared: copy points to it',
      rules[rules.length - 1].querySelector('[data-layout-picker]').value, 'hl1');
    check('shared: original remains',
      document.querySelectorAll('#hostedList .rule').length, 1);
  });
}

/* ---- the clear button wipes shared rules and disables them -------------- */
function assertClearShared() {
  document.getElementById('clearShared').click();
  return wait(400).then(function () {
    check('clear: no shared rules left',
      document.querySelectorAll('#hostedList .rule').length, 0);
    truthy('clear: heading disappears too', document.getElementById('sharedHead').hidden);
    check('clear: shared config disabled', STORE.settings.hosted.active, false);
    truthy('clear: URL remains ready to sync again',
      !!STORE.settings.hosted.url);
    truthy('clear: reported in status',
      document.getElementById('hostedStatus').textContent.indexOf('gewist') !== -1);
    truthy('clear: URL dimmed when inactive',
      document.getElementById('hostedUrl').closest('.field').classList.contains('field--inactive'));

    // Without a URL there is nothing to fetch; that must not be clickable.
    var url = document.getElementById('hostedUrl');
    url.value = '';
    url.dispatchEvent(new Event('input', { bubbles: true }));
    truthy('clear: sync disabled without URL',
      document.getElementById('syncNow').disabled);
    url.dispatchEvent(new Event('change', { bubbles: true }));
    return wait(400).then(function () {
      truthy('clear: empty URL disables shared config too',
        STORE.settings.hosted.active === false && STORE.settings.hosted.url === '');
    });
  });
}

/* ---- real import via the file picker ------------------------------------ */
function importFile() {
  var payload = JSON.stringify({
    app: 'bc-buddy',
    version: 1,
    rules: [
      { id: 'imp-1', name: 'PROD', color: '#8764b8',
        conditions: [{ field: 'environment', op: 'equals', value: 'Productie' }] },
      { id: 'imp-2', name: 'NIEUW', color: '#038387',
        conditions: [{ field: 'environment', op: 'contains', value: 'Acceptatie' }] }
    ]
  });

  FILE_TEXT = payload;
  var transfer = new DataTransfer();
  transfer.items.add(new File([payload], 'bc-buddy.json', { type: 'application/json' }));
  var input = document.getElementById('importFile');
  input.files = transfer.files;
  input.dispatchEvent(new Event('change'));

  return wait(400).then(function () {
    var names = Array.prototype.map.call(
      document.querySelectorAll('#ruleList .rule .rule__name'), function (i) { return i.value; });
    check('import: PROD overwritten, NIEUW added, rest kept',
      names, ['PROD', 'TEST', 'SANDBOX', 'NIEUW']);
    check('import: overwritten rule got color from file',
      document.querySelectorAll('#ruleList .rule')[0]
        .querySelector('input[type="color"][data-path="color"]').value, '#8764b8');
    check('import: overwritten rule got id from file',
      STORE.settings.rules[0].id, 'imp-1');
    var status = document.getElementById('importStatus').textContent;
    check('import: status mentions overwritten and added',
      /1 overschreven/.test(status) && /1 toegevoegd/.test(status) ? 'ok' : status, 'ok');
    truthy('import: zero counts omitted', !/\b0\s/.test(status));
    truthy('import: no layout line for file without layouts',
      status.indexOf('Layouts') === -1);
  });
}

function wait(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}
