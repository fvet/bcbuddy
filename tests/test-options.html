<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BCBuddy options harness</title>
<style>#results { white-space: pre-wrap; font-family: monospace; padding: 12px; }</style>
</head>
<body>
<div id="results">running...</div>
<div id="app"></div>

<script>
var ROOT = '../';
var STORE = {};
var SESSION = {};
var LISTENERS = [];
// What IT set by browser policy (chrome.storage.managed).
var MANAGED = {};
// How BC Buddy was installed (chrome.management.getSelf); 'admin' when IT pushed it.
var INSTALL_TYPE = 'normal';
var SENT = [];

// The options page is in the active tab itself; the button must look further.
var OPTIONS_TAB = { id: 1, url: 'chrome-extension://abcdef/src/options/options.html', active: true, lastAccessed: 300 };
var GOOGLE_TAB = { id: 2, url: 'https://www.google.com/shopping', active: false, lastAccessed: 200 };
var BC_TAB = { id: 3, active: false, lastAccessed: 100,
  url: 'https://businesscentral.dynamics.com/c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811/Productie?company=CONTOSO%20BE' };
var TABS = [OPTIONS_TAB, GOOGLE_TAB, BC_TAB];

/*
 * chrome.i18n with the real messages from _locales/en (the default locale). Loaded synchronously
 * so the scripts below can use them immediately.
 */
var MESSAGES = (function () {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../_locales/en/messages.json', false);
    xhr.send();
    return JSON.parse(xhr.responseText);
  } catch (e) {
    return {};
  }
})();

function i18nStub() {
  return {
    getUILanguage: function () { return 'en'; },
    getMessage: function (key, subs) {
      var entry = MESSAGES[key];
      if (!entry) return '';
      var message = entry.message;
      (subs || []).forEach(function (value, index) {
        message = message.split('$' + (index + 1)).join(value);
      });
      return message;
    }
  };
}
window.chrome = {
  i18n: i18nStub(),
  storage: {
    local: {
      get: function (keys) {
        var out = {};
        var list = typeof keys === 'string' ? [keys] : keys;
        list.forEach(function (k) { if (STORE[k] !== undefined) out[k] = STORE[k]; });
        return Promise.resolve(out);
      },
      set: function (obj) {
        var changes = {};
        Object.keys(obj).forEach(function (k) {
          changes[k] = { oldValue: STORE[k], newValue: obj[k] };
          STORE[k] = obj[k];
        });
        LISTENERS.forEach(function (fn) { fn(changes, 'local'); });
        return Promise.resolve();
      },
      remove: function (k) { delete STORE[k]; return Promise.resolve(); }
    },
    session: {
      get: function (k) {
        var out = {};
        if (SESSION[k] !== undefined) out[k] = SESSION[k];
        return Promise.resolve(out);
      },
      set: function (obj) {
        var changes = {};
        Object.keys(obj).forEach(function (k) {
          changes[k] = { oldValue: SESSION[k], newValue: obj[k] };
          SESSION[k] = obj[k];
        });
        LISTENERS.forEach(function (fn) { fn(changes, 'session'); });
        return Promise.resolve();
      },
      remove: function (k) {
        var changes = {};
        changes[k] = { oldValue: SESSION[k] };
        delete SESSION[k];
        LISTENERS.forEach(function (fn) { fn(changes, 'session'); });
        return Promise.resolve();
      }
    },
    managed: {
      get: function () { return Promise.resolve(JSON.parse(JSON.stringify(MANAGED))); }
    },
    onChanged: { addListener: function (fn) { LISTENERS.push(fn); } }
  },
  runtime: {
    sendMessage: function (msg) { SENT.push(msg); return Promise.resolve({ ok: true, count: 3 }); },
    openOptionsPage: function () {},
    getURL: function (path) { return ROOT + path; },
    onMessage: { addListener: function () {} }
  },
  management: {
    getSelf: function () { return Promise.resolve({ installType: INSTALL_TYPE }); }
  },
  tabs: {
    query: function () { return Promise.resolve(TABS); },
    onActivated: { addListener: function () {} },
    onUpdated: { addListener: function () {} }
  },
  action: { setBadgeText: function () {}, setBadgeBackgroundColor: function () {}, setBadgeTextColor: function () {} },
  alarms: { create: function () {}, clear: function () {}, onAlarm: { addListener: function () {} } }
};

/*
 * FileReader is asynchronous and does not follow headless Chrome's virtual clock,
 * so the test sometimes looked too early. We replace it with a synchronous version:
 * the path we want to test (the change handler, merging, and redrawing) stays fully real.
 */
var FILE_TEXT = '';
window.FileReader = function () {
  var reader = this;
  this.readAsText = function () {
    reader.result = FILE_TEXT;
    if (reader.onload) reader.onload();
  };
};

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function () { reject(new Error('could not load ' + src)); };
    document.head.appendChild(s);
  });
}

var results = [];
function check(name, actual, expected) {
  var ok = JSON.stringify(actual) === JSON.stringify(expected);
  results.push((ok ? 'PASS  ' : 'FAIL  ') + name +
    (ok ? '' : '\n        expected: ' + JSON.stringify(expected) + '\n        got: ' + JSON.stringify(actual)));
}
function truthy(name, actual) {
  results.push((actual ? 'PASS  ' : 'FAIL  ') + name + (actual ? '' : '  (got: ' + JSON.stringify(actual) + ')'));
}
/*
 * Not a verdict but something for a human to glance at, for what no check can
 * decide on its own. The runner prints these and counts none of them.
 */
function note(text) {
  results.push('NOTE  ' + text);
}
function report() {
  var failed = results.filter(function (l) { return l.indexOf('FAIL') === 0; });
  var checks = results.filter(function (l) { return l.indexOf('NOTE') !== 0; });
  document.getElementById('results').textContent =
    results.join('\n') + '\n\nTOTAL: ' + checks.length + ' checks, ' + failed.length + ' failed.';
}

/* ---- syntax check of all script files ----------------------------------- */
var FILES = [
  'src/lib/match.js', 'src/lib/settings.js', 'src/lib/dropdowns.js', 'src/lib/panes.js', 'src/lib/bcstate.js',
  'src/lib/maximize.js', 'src/lib/actionbar.js', 'src/lib/factbox.js', 'src/lib/copyvalues.js', 'src/lib/newtab.js',
  'src/lib/weeknumbers.js', 'src/lib/shortcuts.js',
  'src/content/content.js',
  'src/background.js', 'src/options/options-helpers.js', 'src/options/options-cards.js',
  'src/options/options-hosted.js', 'src/options/options.js', 'src/sidepanel/sidepanel.js', 'src/sidepanel/help.js',
  'src/support/support-overlay.js'
];

Promise.all(FILES.map(function (f) {
  return fetch(ROOT + f).then(function (r) { return r.text(); }).then(function (text) {
    try {
      new Function(text);
      return 'PASS  syntax: ' + f;
    } catch (e) {
      return 'FAIL  syntax: ' + f + '\n        ' + e.message;
    }
  }, function () { return 'FAIL  syntax: ' + f + ' (not found)'; });
})).then(function (lines) {
  lines.forEach(function (l) { results.push(l); });
  return assertMessages();
}).then(assertBrandMark).then(runOptions).then(report, function (err) {
  results.push('FAIL  harness: ' + err.message);
  report();
});

/* ---- the brand appears twice -------------------------------------------
 * logo.svg supplies the PNGs; the options page has the brand inline, because
 * only that way can the tint follow the browser theme.
 * That copy can therefore quietly drift from the source.
 * Hence this check on the geometry — not the colors: the fill differs on purpose
 * (var(--brand-mark) versus a fixed tint), as do the ids, which must be unique per document.
 */
function markSignature(svg) {
  function attrs(el, names) {
    return names.map(function (name) {
      return name + '=' + String(el.getAttribute(name) || '').trim().toLowerCase();
    }).join(' ');
  }

  var bite = svg.querySelector('mask circle');
  var text = svg.querySelector('text');

  // The dot sits outside the mask; the circle inside cuts out the bite.
  var dot = null;
  svg.querySelectorAll('circle').forEach(function (circle) {
    if (!dot && !circle.closest('mask')) dot = circle;
  });
  if (!bite || !text || !dot) throw new Error('incomplete brand');

  return [
    'viewBox=' + String(svg.getAttribute('viewBox') || '').trim(),
    'bite ' + attrs(bite, ['cx', 'cy', 'r']),
    'text ' + attrs(text, ['x', 'y', 'text-anchor', 'font-size', 'font-weight', 'letter-spacing']),
    'letters=' + text.textContent.trim(),
    'dot ' + attrs(dot, ['cx', 'cy', 'r', 'fill'])
  ].join(' | ');
}

function assertBrandMark() {
  var sources = ['icons/logo.svg', 'src/options/options.html'];
  return Promise.all(sources.map(function (f) {
    return fetch(ROOT + f).then(function (r) { return r.text(); });
  })).then(function (texts) {
    var parser = new DOMParser();
    var expected = markSignature(parser.parseFromString(texts[0], 'image/svg+xml').documentElement);

    function inlineMark(html, where) {
      var found = null;
      // The header sets "Buddy" after the mark, so take the svg that holds
      // the BC itself rather than the first svg around it.
      parser.parseFromString(html, 'text/html').querySelectorAll('svg text').forEach(function (text) {
        if (!found && text.textContent.trim() === 'BC') found = text.closest('svg');
      });
      if (!found) throw new Error('no brand found in ' + where);
      return found;
    }

    check('brand: options page matches logo.svg',
      markSignature(inlineMark(texts[1], 'options.html')), expected);
  });
}

/* ---- translations -------------------------------------------------------
 * Everything below holds for a language nobody on the team can read: it looks
 * at keys, placeholders, encoding and length, never at meaning. What these
 * checks cannot judge is in TRANSLATING.md.
 */

/*
 * The locale folder names the Web Store accepts. Upload rejects anything else,
 * so a folder outside this list is a packaging mistake rather than a language.
 * Mind the underscores: pt_BR, not pt-BR.
 */
var STORE_LOCALES = [
  'am', 'ar', 'bg', 'bn', 'ca', 'cs', 'da', 'de', 'el', 'en', 'en_GB', 'en_US',
  'es', 'es_419', 'et', 'fa', 'fi', 'fil', 'fr', 'gu', 'he', 'hi', 'hr', 'hu',
  'id', 'it', 'ja', 'kn', 'ko', 'lt', 'lv', 'ml', 'mr', 'ms', 'nl', 'no', 'pl',
  'pt_BR', 'pt_PT', 'ro', 'ru', 'sk', 'sl', 'sr', 'sv', 'sw', 'ta', 'te', 'th',
  'tr', 'uk', 'vi', 'zh_CN', 'zh_TW'
];

/*
 * A locale where this much of the text still equals the default locale was
 * copied rather than translated. Below that line an identical string is only
 * worth a look - plenty of words are the same in two languages - so those are
 * printed as NOTE and fail nothing.
 */
var UNTRANSLATED_LIMIT = 0.4;

/*
 * Which locales there are. The runner reads _locales from disk and passes the
 * folder names along, so a folder the Web Store would reject still arrives
 * here and fails the check below. Opened by hand a page cannot list a
 * directory, so then we probe: that finds every valid locale and quietly
 * misses an invalid one.
 */
function localeFolders() {
  var declared = /[?&]locales=([^&]*)/.exec(location.search);
  if (declared) {
    return Promise.resolve(decodeURIComponent(declared[1]).split(',').filter(Boolean));
  }
  return Promise.all(STORE_LOCALES.map(function (code) {
    return fetch(ROOT + '_locales/' + code + '/messages.json')
      .then(function () { return code; }, function () { return ''; });
  })).then(function (found) { return found.filter(Boolean); });
}

/*
 * Reads one messages.json as bytes rather than as text: a file saved in the
 * Windows code page instead of UTF-8 is exactly the kind of thing that only
 * shows on the accented letters of a language you do not speak.
 */
function loadLocale(code) {
  return fetch(ROOT + '_locales/' + code + '/messages.json')
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (buffer) {
      var bytes = new Uint8Array(buffer);
      var locale = {
        code: code,
        bom: bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF,
        utf8: true,
        error: '',
        messages: {}
      };
      var text = '';
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
      } catch (e) {
        locale.utf8 = false;
        return locale;
      }
      try {
        locale.messages = JSON.parse(text);
      } catch (e) {
        locale.error = e.message;
      }
      return locale;
    });
}

/* The $1, $2, ... a message expects, without duplicates. $$ is a literal dollar. */
function placeholders(message) {
  var found = String(message).replace(/\$\$/g, '').match(/\$\d/g) || [];
  return found.filter(function (p, i) { return found.indexOf(p) === i; }).sort();
}

function messageText(locale, key) {
  return String((locale.messages[key] || {}).message || '');
}

function assertMessages() {
  var sources = FILES.concat(['src/lib/i18n.js', 'src/options/options.html', 'src/sidepanel/sidepanel.html', 'manifest.json']);
  return localeFolders().then(function (codes) {
    return Promise.all([
      fetch(ROOT + 'manifest.json').then(function (r) { return r.json(); }),
      Promise.all(codes.map(loadLocale)),
      Promise.all(sources.map(function (f) {
        return fetch(ROOT + f).then(function (r) { return r.text(); });
      }))
    ]);
  }).then(function (loaded) {
    // A popup would swallow the click that background.js turns into the
    // options page.
    check('manifest: the toolbar icon has no popup',
      (loaded[0].action || {}).default_popup, undefined);
    var fallback = loaded[0].default_locale;
    var locales = loaded[1];
    var source = loaded[2].join('\n');

    var base = null;
    locales.forEach(function (l) { if (l.code === fallback) base = l; });

    truthy('i18n: more than one language', locales.length > 1);
    truthy('i18n: the default locale (' + fallback + ') is one of them', !!base);
    if (!base) return;

    // A new folder needs a place in the language picker too, and in the list
    // i18n.js checks a stored choice against.
    var codes = locales.map(function (l) { return l.code; }).sort();
    var listed = /var LANGUAGES = \[([^\]]*)\]/.exec(source);
    check('i18n: i18n.js knows every language', listed ? (listed[1].match(/[a-z_A-Z]+/g) || []).sort() : null, codes);
    var picker = /<select id="language"[\s\S]*?<\/select>/.exec(source);
    var offered = picker ? (picker[0].match(/value="[^"]+"/g) || [])
      .map(function (v) { return v.slice(7, -1); }).sort() : null;
    check('i18n: the language picker offers every language', offered, codes);

    check('i18n: every locale folder is a name the Web Store accepts',
      locales.map(function (l) { return l.code; })
        .filter(function (c) { return STORE_LOCALES.indexOf(c) < 0; }), []);

    check('i18n: every messages.json is valid JSON',
      locales.filter(function (l) { return l.error; })
        .map(function (l) { return l.code + ': ' + l.error; }), []);

    check('i18n: every messages.json is UTF-8 without a BOM',
      locales.filter(function (l) { return !l.utf8 || l.bom; })
        .map(function (l) { return l.code + ': ' + (l.utf8 ? 'starts with a BOM' : 'not valid UTF-8'); }), []);

    var keys = Object.keys(base.messages).sort();
    var others = locales.filter(function (l) { return l !== base; });

    check('i18n: every locale has the same keys as ' + fallback,
      others.reduce(function (out, l) {
        keys.filter(function (k) { return !l.messages[k]; })
          .forEach(function (k) { out.push(l.code + ': missing ' + k); });
        Object.keys(l.messages).sort().filter(function (k) { return !base.messages[k]; })
          .forEach(function (k) { out.push(l.code + ': unknown ' + k); });
        return out;
      }, []), []);

    check('i18n: every message has text',
      locales.reduce(function (out, l) {
        Object.keys(l.messages).sort()
          .filter(function (k) { return !messageText(l, k).trim(); })
          .forEach(function (k) { out.push(l.code + ': ' + k); });
        return out;
      }, []), []);

    // A dropped or invented $1 ships a broken sentence, and word order differs
    // per language, so compare the set rather than the position.
    check('i18n: every translation keeps the same placeholders',
      others.reduce(function (out, l) {
        keys.filter(function (k) { return !!l.messages[k]; }).forEach(function (k) {
          var mine = placeholders(messageText(l, k));
          var theirs = placeholders(messageText(base, k));
          if (mine.join() !== theirs.join()) {
            out.push(l.code + ': ' + k + ' has ' + (mine.join(' ') || 'none') +
              ' instead of ' + (theirs.join(' ') || 'none'));
          }
        });
        return out;
      }, []), []);

    // "$1 rule(s) from $2" says nothing about what gets substituted, so a
    // message that uses a placeholder has to explain itself.
    check('i18n: every message with a placeholder has a description',
      keys.filter(function (k) {
        return placeholders(messageText(base, k)).length &&
          !String(base.messages[k].description || '').trim();
      }), []);

    others.forEach(function (l) {
      var copied = keys.filter(function (k) {
        return l.messages[k] && messageText(l, k).trim() === messageText(base, k).trim();
      });
      truthy('i18n: ' + l.code + ' is translated, not copied (' + copied.length + ' of ' +
        keys.length + ' still reads as ' + fallback + ')',
        copied.length < keys.length * UNTRANSLATED_LIMIT);
      if (copied.length) {
        note('i18n: ' + l.code + ' equals ' + fallback + ' word for word in ' +
          copied.length + ' message(s): ' + copied.join(', '));
      }
    });

    function collect(into, pattern) {
      var match;
      var re = new RegExp(pattern, 'g');
      while ((match = re.exec(source)) !== null) into[match[1]] = true;
    }

    // Definite keys: a message must exist for each of these.
    var used = {};
    collect(used, "\\bt\\('([A-Za-z0-9_]+)'");                                  // t('key')
    collect(used, 'data-i18n(?:-title|-label|-placeholder)?="([A-Za-z0-9_]+)"'); // in the HTML
    collect(used, "key: '([A-Za-z0-9_]+)'");                                     // fields and operators
    collect(used, '__MSG_([A-Za-z0-9_]+)__');                                    // in the manifest

    // Broader: any name that appears in quotes somewhere. Also catches
    // t(condition ? 'a' : 'b'), which the pattern above misses.
    var mentioned = {};
    collect(mentioned, "'([A-Za-z0-9_]+)'");

    var usedKeys = Object.keys(used).sort();
    truthy('i18n: keys are used', usedKeys.length > 40);
    check('i18n: no missing keys',
      usedKeys.filter(function (k) { return !base.messages[k]; }), []);
    check('i18n: no unused keys',
      keys.filter(function (k) { return !used[k] && !mentioned[k]; }), []);

    // The Web Store rejects a package whose description is longer than 132
    // characters - per language, so every file has to fit.
    check('i18n: description stays under 132 characters',
      locales.filter(function (l) { return messageText(l, 'extDescription').length > 132; })
        .map(function (l) { return l.code; }), []);
  });
}

/* ---- actually build the options page ----------------------------------- */
function runOptions() {
  STORE.settings = {
    enabled: true,
    rules: [
      {
        id: 'a', name: 'TEST', color: '#bc0000', styleId: 'lay-1',
        conditions: [{ field: 'environment', op: 'contains', value: 'Sandbox' }]
      },
      {
        id: 'b', name: 'PROD', color: '#107c10', styleId: 'lay-1',
        conditions: [{ field: 'environment', op: 'equals', value: 'Productie' }]
      }
    ],
    hosted: {
      url: 'https://raw.githubusercontent.com/x/y/main/bc.json',
      active: true,
      sourceName: 'Bedrijf X',
      lastSync: '2026-08-22T09:00:00.000Z',
      rules: [{ id: 'h1', name: 'GEDEELD', color: '#0f6cbd', styleId: 'hl1',
                 conditions: [{ field: 'url', op: 'contains', value: 'dynamics' }] }],
      styles: [{ id: 'hl1', name: 'GEDEELDE STYLE', border: { enabled: true, width: 5 } }]
    },
    styles: [
      { id: 'lay-1', name: 'Standaard',
        ribbon: { enabled: true, text: 'Dynamics 365 Business Central - {environment} - {company} ({name})' },
        border: { enabled: true, width: 4 },
        banner: { enabled: true, position: 'top-right', text: '{name}' } },
      { id: 'lay-2', name: 'Compact',
        ribbon: { enabled: true, text: 'STYLE {environment}' },
        border: { enabled: true, width: 2 },
        banner: { enabled: true, position: 'bottom-left', text: 'uit de style' } }
    ]
  };

  return fetch(ROOT + 'src/options/options.html')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
      document.getElementById('app').innerHTML = doc.body.innerHTML;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = ROOT + 'src/options/options.css';
      document.head.appendChild(css);
      return loadScript(ROOT + 'src/lib/i18n.js')
        .then(function () { return loadScript(ROOT + 'src/lib/match.js'); })
        .then(function () { return loadScript(ROOT + 'src/lib/settings.js'); })
        .then(function () { return loadScript(ROOT + 'src/lib/dropdowns.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options-helpers.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options-cards.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options-hosted.js'); })
        .then(function () { return loadScript(ROOT + 'src/options/options.js'); });
    })
    .then(function () {
      return new Promise(function (resolve) { setTimeout(resolve, 500); });
    })
    .then(assertOptions);
}

function assertOptions() {
  // A first visit, with no panel remembered, opens on the Web client panel.
  check('nav: a first visit opens on the Web client panel',
    [!document.querySelector('.panel[data-panel="webclient"]').hidden,
      document.querySelector('.panel[data-panel="environments"]').hidden,
      document.querySelector('.nav__item[data-panel="webclient"]').getAttribute('aria-current')],
    [true, true, 'page']);
  // The checks below work with the rules, so open their panel.
  document.querySelector('.nav__item[data-panel="environments"]').click();

  // On open the test URL comes from the BC tab, though Google was used later.
  var testUrl = document.getElementById('testUrl');
  check('options: test URL filled in from the open BC tab',
    [testUrl.value, STORE.ui && STORE.ui.testUrl], [BC_TAB.url, BC_TAB.url]);
  // The checks below expect the sample URL.
  testUrl.value = 'https://businesscentral.dynamics.com/c1cf0fd8-6b50-4d5a-8627-9ea2c09c6811/' +
    'Sandbox?company=CRONUS%20BE&page=1';
  testUrl.dispatchEvent(new Event('input'));

  var cards = document.querySelectorAll('#ruleList .rule');
  check('options: own rules rendered', cards.length, 2);
  check('options: document lang follows UI language',
    document.documentElement.lang, 'en');
  check('options: shared rule rendered', document.querySelectorAll('#hostedList .rule').length, 1);

  var first = cards[0];
  var styleOne = document.querySelectorAll('#styleList .rule')[0];
  check('options: name filled in', first.querySelector('.rule__name').value, 'TEST');
  check('options: color field filled in', first.querySelector('input[type="color"][data-path="color"]').value, '#bc0000');
  check('options: no preview on a rule anymore', first.querySelector('[data-preview]'), null);
  // A style preview borrows the rule the test URL gets.
  check('options: ribbon preview text lives on the style',
    styleOne.querySelector('[data-preview-brand]').textContent,
    'Dynamics 365 Business Central - Sandbox - CRONUS BE (TEST)');
  check('options: style preview takes the matching rule colour',
    styleOne.querySelector('[data-preview-frame]').style.borderColor, 'rgb(188, 0, 0)');

  var nameField = document.querySelectorAll('#ruleList .rule')[0].querySelector('.rule__name');
  var nameBefore = nameField.value;
  nameField.value = '  ' + nameBefore + '  ';
  nameField.dispatchEvent(new Event('input', { bubbles: true }));
  nameField.dispatchEvent(new Event('change', { bubbles: true }));
  check('options: spaces around name trimmed', nameField.value, nameBefore);

  // without mouse: the grip moves with arrow keys
  var second = document.querySelectorAll('#ruleList .rule')[1];
  second.querySelector('[data-grip]').dispatchEvent(
    new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true, cancelable: true }));
  check('options: rule moved up',
    document.querySelectorAll('#ruleList .rule')[0].querySelector('.rule__name').value, 'PROD');
  var rerendered = document.querySelectorAll('#ruleList .rule');
  truthy('options: expanded rule stays open after redraw',
    !rerendered[1].classList.contains('rule--collapsed'));
  truthy('options: new rule opens immediately',
    !rerendered[2].classList.contains('rule--collapsed'));
  truthy('options: untouched rule stays collapsed',
    rerendered[0].classList.contains('rule--collapsed'));

  // with the mouse: drop the top rule below the last one
  var ruleNames = function () {
    return Array.prototype.map.call(
      document.querySelectorAll('#ruleList .rule .rule__name'), function (i) { return i.value; });
  };
  var namesBefore = ruleNames();
  var dragged = document.querySelectorAll('#ruleList .rule')[0];
  var transfer = new DataTransfer();
  dragged.querySelector('[data-grip]').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
  truthy('options: grip makes card draggable', dragged.draggable);
  dragged.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
  truthy('options: released without dragging, the card is normal again', !dragged.draggable);
  dragged.querySelector('[data-swatch]').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
  truthy('options: colour swatch makes card draggable', dragged.draggable);
  dragged.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
  dragged.querySelector('[data-grip]').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
  dragged.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));

  var lastCard = document.querySelectorAll('#ruleList .rule')[namesBefore.length - 1];
  var bottomEdge = lastCard.getBoundingClientRect().bottom - 2;
  lastCard.dispatchEvent(new DragEvent('dragover',
    { bubbles: true, cancelable: true, dataTransfer: transfer, clientY: bottomEdge }));
  truthy('options: target rule shows drop position',
    lastCard.classList.contains('rule--drop-after'));
  lastCard.dispatchEvent(new DragEvent('drop',
    { bubbles: true, cancelable: true, dataTransfer: transfer, clientY: bottomEdge }));
  check('options: dragged rule is now at bottom', ruleNames(), namesBefore.slice(1).concat(namesBefore[0]));

  // and back again, so the rest of the test can continue with the old order
  document.querySelectorAll('#ruleList .rule')[namesBefore.length - 1].querySelector('[data-grip]')
    .dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true, cancelable: true }));
  document.querySelectorAll('#ruleList .rule')[namesBefore.length - 2].querySelector('[data-grip]')
    .dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true, cancelable: true }));
  check('options: arrows move them back to top', ruleNames(), namesBefore);

  // add a condition
  var card0 = document.querySelectorAll('#ruleList .rule')[0];
  card0.querySelector('[data-action="add-condition"]').click();
  check('options: condition added', card0.querySelectorAll('.condition').length, 2);
  card0.querySelector('[data-action="add-condition"]').click();
  check('options: + adds no second empty condition', card0.querySelectorAll('.condition').length, 2);
  check('options: + goes to the empty condition instead',
    document.activeElement, card0.querySelectorAll('.condition')[1].querySelector('[data-cond="value"]'));

  // the same condition twice is flagged, and + goes there too
  var condRows = card0.querySelectorAll('.condition');
  ['field', 'op'].forEach(function (name) {
    var select = condRows[1].querySelector('[data-cond="' + name + '"]');
    select.value = condRows[0].querySelector('[data-cond="' + name + '"]').value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  });
  var repeatValue = condRows[1].querySelector('[data-cond="value"]');
  repeatValue.value = ' ' + condRows[0].querySelector('[data-cond="value"]').value.toUpperCase() + ' ';
  repeatValue.dispatchEvent(new Event('input', { bubbles: true }));
  check('options: a repeated condition is flagged',
    [repeatValue.getAttribute('aria-invalid'), repeatValue.title],
    ['true', chrome.i18n.getMessage('conditionRepeated')]);
  check('options: the first of the two is not',
    condRows[0].querySelector('[data-cond="value"]').getAttribute('aria-invalid'), null);
  repeatValue.blur();
  card0.querySelector('[data-action="add-condition"]').click();
  check('options: + adds nothing while a condition repeats',
    [card0.querySelectorAll('.condition').length, document.activeElement], [2, repeatValue]);
  repeatValue.value = '';
  repeatValue.dispatchEvent(new Event('input', { bubbles: true }));
  check('options: emptied, it is no longer flagged', repeatValue.getAttribute('aria-invalid'), null);

  check('options: no replace vs add choice',
    document.querySelector('input[name="importMode"]'), null);
  check('options: no brand name selector', document.getElementById('brandSelector'), null);
  check('options: no ribbon bar selector', document.getElementById('ribbonSelector'), null);
  check('options: no bold toggle on ribbon',
    styleOne.querySelector('[data-path="ribbon.bold"]'), null);

  // sync saves first, then messages the service worker
  document.getElementById('syncNow').click();

  // wait until save + message have run (and the earlier debounce has settled)
  return wait(500).then(function () {
    check('options: sync sends message',
      SENT.length > 0 && SENT[SENT.length - 1].type, 'bcb:sync');
    truthy('options: settings saved', !!STORE.settings && STORE.settings.rules.length === 3);
    check('options: save reports nothing',
      document.getElementById('status').textContent, '');
    check('options: saved order', STORE.settings.rules[0].name, 'PROD');
    return assertNav().then(assertToolbarOpen).then(assertWebClient).then(assertStyles).then(importFile)
      .then(assertParsedUrl).then(assertSharedCopy).then(assertClearShared)
      .then(assertExternalWrite).then(assertPolicyLock).then(assertAreas).then(assertFeedback)
      .then(assertLocks).then(assertEdgeCases).then(assertSamples)
      .then(assertResetWebClient);
  });
}

/* ---- get URL from an open tab ------------------------------------------- */
function assertTabPicker(input) {
  var button = document.getElementById('useCurrentTab');

  button.click();
  return wait(200).then(function () {
    check('tab: ignores options page and picks BC tab', input.value, BC_TAB.url);

    // without a BC tab, the most recently used tab wins

    button.click();
    return wait(200);
  }).then(function () {

    return wait(200);

    check('tab: nothing usable leaves test URL unchanged', input.value, 'ongewijzigd');

      document.getElementById('status').textContent, chrome.i18n.getMessage('noUsableTab'));
    TABS = [OPTIONS_TAB, GOOGLE_TAB, BC_TAB];

}

        STORE.settings.rules.map(function (r) { return r.styleId; })],
      [['full', 'subtle'], ['full', 'full', 'full', 'full']]);
    check('samples: status says how many', status.textContent,
      chrome.i18n.getMessage('samplesAdded', ['4']));
    truthy('samples: the empty message is gone', empty.hidden);
    button.click();
    return wait(400);
  }).then(function () {
    check('samples: a second click adds nothing', [names().length, status.textContent],
      [4, chrome.i18n.getMessage('samplesNone')]);
    return setPolicy({ sharedConfigUrl: 'https://example.com/shared.json' });
  }).then(function () {
    truthy('samples: hidden once IT sets the shared file', button.hidden);
    return setPolicy({});
  }).then(function () {
    truthy('samples: back when the policy is gone', !button.hidden);
    // IT pushed BC Buddy after the page was drawn: the click checks again.
    INSTALL_TYPE = 'admin';
    var stored = JSON.parse(JSON.stringify(STORE.settings));
    stored.rules = [];
    return chrome.storage.local.set({ settings: stored }).then(function () { return wait(300); });
  }).then(function () {
    button.click();
    return wait(400);
  }).then(function () {
    check('samples: nothing added when IT installed BC Buddy', names(), []);
    truthy('samples: and the button hides', button.hidden);
    check('samples: the empty message does not mention it', empty.textContent,
      message('emptyRules', ['addRule', 'emptyRulesImport']));
    check('samples: and has two links left',
      links(), ['addRule', 'emptyRulesImport'].map(function (k) { return chrome.i18n.getMessage(k); }));

    // The import link goes to the import button's panel and opens the picker.
    var picker = document.getElementById('importFile');
    var opened = 0;
    picker.click = function () { opened++; };
    empty.querySelectorAll('button.empty__action')[1].click();
    delete picker.click;
    check('empty: import link opens the file picker', opened, 1);
    truthy('empty: on the panel where its result shows',
      !document.querySelector('.panel[data-panel="settings"]').hidden);
    document.querySelector('.nav__item[data-panel="environments"]').click();

    empty.querySelector('button.empty__action').click();
    return wait(400);
  }).then(function () {
    check('empty: Add rule link adds a rule', document.querySelectorAll('#ruleList .rule').length, 1);
    truthy('empty: and the message goes', empty.hidden);
    INSTALL_TYPE = 'normal';
    var stored = JSON.parse(JSON.stringify(STORE.settings));
    stored.rules = [];
    return chrome.storage.local.set({ settings: stored }).then(function () { return wait(300); });
  });
}

/* ---- Reset to defaults on the Web client panel -------------------------- */
function assertResetWebClient() {
  var button = document.getElementById('resetWebClientLabel');
  var status = document.getElementById('resetStatus');
  function store(patch) {
    var stored = JSON.parse(JSON.stringify(STORE.settings));
    Object.keys(patch).forEach(function (key) { stored[key] = patch[key]; });
    return chrome.storage.local.set({ settings: stored }).then(function () { return wait(300); });
  }
  function onOff() {
    return [STORE.settings.stripeRows.enabled, STORE.settings.hideFactBox.enabled,
      STORE.settings.copyValues.enabled];
  }

  check('reset: the button lives in the Web client panel',
    button.closest('.panel'), document.querySelector('.panel[data-panel="webclient"]'));
  return store({
    stripeRows: { enabled: true }, hideFactBox: { enabled: true }, copyValues: { enabled: true },
    dropdown: { width: 5, height: 5 },
    hosted: { url: 'https://example.com/shared.json', active: true, rules: [], styles: [],
      webClient: { copyValues: { enabled: false } } }
  }).then(function () {
    check('reset: the label names the team when the shared file sets something',
      button.textContent, chrome.i18n.getMessage('resetWebClientTeam'));
    button.click();
    return wait(400);
  }).then(function () {
    check('reset: app defaults, with the shared file on top', onOff(), [false, false, false]);
    check('reset: the switches follow',
      document.getElementById('copyValuesEnabled').checked, false);
    check('reset: the area switch is left alone', STORE.settings.webClientEnabled, true);
    check('reset: says how many, with an undo',
      [status.firstChild.textContent, status.querySelector('button').textContent],
      [chrome.i18n.getMessage('resetWebClientDone', ['3']), chrome.i18n.getMessage('undo')]);
    status.querySelector('button').click();
    return wait(400);
  }).then(function () {
    check('reset: undo puts everything back', onOff(), [true, true, true]);
    check('reset: and says so', status.textContent, chrome.i18n.getMessage('resetWebClientUndone'));
    button.click();
    return wait(100);
  }).then(function () {
    document.getElementById('stripeRowsEnabled').click();
    check('reset: a change by hand drops the undo', status.textContent, '');
    var hosted = JSON.parse(JSON.stringify(STORE.settings.hosted));
    hosted.active = false;
    return wait(400).then(function () { return store({ hosted: hosted }); });
  }).then(function () {
    check('reset: without the shared file, the plain label',
      button.textContent, chrome.i18n.getMessage('resetWebClient'));
    button.click();
    return wait(400);
  }).then(function () {
    check('reset: then only the app defaults count', onOff(), [false, false, true]);
    button.click();
    return wait(100);
  }).then(function () {
    check('reset: nothing to reset says so', status.textContent,
      chrome.i18n.getMessage('resetWebClientNone'));
  });
}

function wait(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}
</script>
