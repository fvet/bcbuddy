<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    BC Buddy - vereenvoudigd merk voor 16 en 32 px.
    Op die formaten is een letter ongeveer vijf pixels breed; twee letters
    lopen dan dicht.  Deze versie houdt alleen de C met de uitsparing en de
    metgezel over: zelfde gebaar, zelfde kleuren, wel leesbaar.
  -->
  <mask id="bite-small">
    <rect width="128" height="128" fill="#fff"/>
    <circle cx="91" cy="92" r="30" fill="#000"/>
  </mask>
  <g mask="url(#bite-small)">
    <text x="47" y="100" text-anchor="middle"
          font-family="'Segoe UI Semibold','Segoe UI',Segoe,Tahoma,Helvetica,Arial,sans-serif"
          font-weight="600" font-size="122" fill="#737C8A">C</text>
  </g>
  <circle cx="91" cy="92" r="22" fill="#00B7C3"/>
</svg>
