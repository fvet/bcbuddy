name: Release

# Started by hand from the Actions tab, on main. Every submission to the store
# costs review time, so a release stays a deliberate act — but the version, the
# tag and the package are all produced here, so they cannot disagree.
#
# One workflow rather than two: the tag is pushed from inside this run, so a
# separate tag-triggered workflow would be a second place for the release to go
# wrong. The release job versions, builds, tags and pushes; the GitHub release
# and the store upload follow as jobs of their own, on fresh runners, so the
# deploy key, the store secrets and the third-party action never share one.
#
# Every action is pinned to a full commit SHA, with its version in a comment
# that Dependabot keeps up to date: a tag can be moved, a commit cannot.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: 'Exact version instead (e.g. 1.2.0) — overrides the choice above'
        type: string
        default: ''
      store:
        description: 'Chrome Web Store: upload as a draft, upload and submit for review, or nothing'
        type: choice
        default: draft
        options: [draft, publish, none]

# Read-only by default. The release job pushes over SSH with the deploy key,
# not with this token; only the GitHub release job gets to write.
permissions:
  contents: read

# Two releases at once would race on the version in main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    # Read by the jobs below: the site is built from the very commit this run
    # tagged, and the store job only uploads a ZIP with this hash.
    outputs:
      tag: v${{ steps.version.outputs.next }}
      version: ${{ steps.version.outputs.next }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Release from main only
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -ne 'main') {
            throw "Releases are cut from main; this run is on '$env:REF_NAME'."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release notes can be diffed against the last tag.
          fetch-depth: 0
          # A ruleset keeps main closed to direct pushes, and GITHUB_TOKEN is not
          # something that ruleset can exempt. The repository's write deploy key
          # is on its bypass list, so the release commit goes out over SSH under
          # that key; checkout points the remote at SSH for the rest of the job.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      # Before the version is touched: a failure here must not leave a bumped
      # manifest behind, half a release.
      - name: Run test suites
        shell: powershell
        run: .\tests\run-tests.ps1

      - name: Work out the next version
        id: version
        shell: pwsh
        env:
          # Through env, not interpolated into the script: an input is data.
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $current = [string]$manifest.version
          $explicit = "$env:EXPLICIT".Trim()

          if ($explicit) {
            $next = $explicit
          } else {
            $parts = @($current -split '\.' | ForEach-Object { [int]$_ })
            while ($parts.Count -lt 3) { $parts += 0 }
            switch ($env:BUMP) {
              'major' { $parts[0]++; $parts[1] = 0; $parts[2] = 0 }
              'minor' { $parts[1]++; $parts[2] = 0 }
              default { $parts[2]++ }
            }
            $next = ($parts[0..2]) -join '.'
          }

          # Chrome accepts one to four dot-separated integers, each 0-65535, and
          # no suffix: '1.2.0-rc.1' is not a version the store will take.
          $fields = @($next -split '\.')
          if ($fields.Count -lt 1 -or $fields.Count -gt 4) {
            throw "Version '$next' must have one to four parts."
          }
          foreach ($field in $fields) {
            if ($field -notmatch '^(0|[1-9][0-9]*)$' -or [int]$field -gt 65535) {
              throw "Version '$next' has an invalid part '$field' (0-65535, no leading zeros)."
            }
          }

          # The store refuses a version it already holds, so going backwards
          # would waste a release that cannot be retried under the same number.
          $ordinal = { param($v) ($v -split '\.' | ForEach-Object { '{0:00000}' -f [int]$_ }) -join '' }
          if ((& $ordinal $next) -le (& $ordinal $current)) {
            throw "Version $next is not above the current $current."
          }

          Write-Host "$current -> $next"
          "current=$current" | Out-File $env:GITHUB_OUTPUT -Append
          "next=$next" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Write it into the manifest
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'manifest.json'
          $raw = [System.IO.File]::ReadAllText($path)
          # Only the version field: rewriting the file through ConvertTo-Json
          # would reorder and reformat everything around it.
          $pattern = '("version"\s*:\s*")[^"]*(")'
          $hits = ([regex]$pattern).Matches($raw).Count
          if ($hits -ne 1) { throw "Expected one version field in manifest.json, found $hits." }
          $updated = [regex]::Replace($raw, $pattern, '${1}${{ steps.version.outputs.next }}${2}')
          # WriteAllText gives UTF-8 without a BOM; Set-Content would add one.
          [System.IO.File]::WriteAllText($path, $updated)

      # The notes people read are written by hand under '## Unreleased' as the
      # changes land, so deciding what is worth mentioning happens in the pull
      # request that caused it. This step only dates that section and opens an
      # empty one for the next release. Generated notes were the alternative and
      # they read like the commit log: dependency bumps and CI fixes in front of
      # users, in wording aimed at whoever wrote the code.
      - name: Close off the changelog
        shell: pwsh
        env:
          # Through env, not interpolated into the script: an input is data.
          STORE_ACTION: ${{ inputs.store }}
        run: |
          $path = Join-Path $PWD 'CHANGELOG.md'
          $raw = [System.IO.File]::ReadAllText($path)
          $nl = if ($raw -match "`r`n") { "`r`n" } else { "`n" }

          # The website includes the file from this marker down, so the new
          # version has to land below it while Unreleased stays above. Matching
          # on it as well means a marker that was moved or lost fails the release
          # rather than quietly publishing notes on the wrong side of the line.
          $marker = '<!-- --8<-- [start:released] -->'

          # The heading, everything under it, and the marker line's terminator:
          # the whole block is written back out below, marker included.
          $pattern = '(?ms)^## Unreleased[ \t]*\r?$(.*?)^' + [regex]::Escape($marker) + '[ \t]*\r?\n'
          $section = [regex]::Match($raw, $pattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md needs a '## Unreleased' section followed by the line '$marker'."
          }

          $notes = $section.Groups[1].Value.Trim()
          if (-not $notes) {
            # Not a failure: a release can be worth cutting for a dependency or
            # a store requirement with nothing to show for it. Saying so beats
            # an empty section, and beats blocking the release.
            $notes = 'Maintenance release - nothing that changes what you see.'
            Write-Host '::warning::Nothing under Unreleased; the notes say so.'
          }

          # Built from the code point rather than typed, so the encoding this
          # script is handed cannot turn the em dash into mojibake.
          $dash = [char]0x2014
          $heading = "## ${{ steps.version.outputs.next }} $dash $(Get-Date -Format 'yyyy-MM-dd')"

          # Substring surgery rather than [regex]::Replace: a '$1' written in a
          # changelog entry would otherwise be read as a capture group.
          $replacement = "## Unreleased$nl$nl$marker$nl$nl$heading$nl$nl$notes$nl"
          $updated = $raw.Substring(0, $section.Index) + $replacement +
            $raw.Substring($section.Index + $section.Length)
          [System.IO.File]::WriteAllText($path, $updated)

          # The body of the GitHub release. Written to the runner's temp rather
          # than the tree, so the commit below cannot pick it up. Joined from an
          # array rather than a here-string: a here-string's closing '"@' has to
          # sit at column 0, which would end this YAML block scalar early.
          $body = @(
            $notes,
            '',
            '---',
            '',
            "Chrome Web Store: ``$env:STORE_ACTION``.",
            '',
            'A draft upload leaves the published version live; submit it from the',
            'dashboard when you are ready. Publishing still enters review',
            "$dash this release does not put anything in front of users by itself."
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-notes.md'), $body)
          Write-Host $heading

      - name: Build package
        shell: powershell
        run: .\tools\build-package.ps1

      # Cheap guard against a slip in the rewrite above: what is in the ZIP is
      # what reaches the store, so that is what gets checked.
      - name: Package must declare the new version
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.next }}'
          $zip = Get-Item "dist/bcbuddy-$expected.zip" -ErrorAction Stop
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq 'manifest.json' }
            if (-not $entry) { throw 'manifest.json is not at the root of the ZIP.' }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { $packaged = ($reader.ReadToEnd() | ConvertFrom-Json).version } finally { $reader.Dispose() }
          } finally {
            $archive.Dispose()
          }
          if ($packaged -ne $expected) {
            throw "The package declares $packaged, expected $expected."
          }
          Write-Host "Package declares $packaged."

      # Only now does anything leave the runner: if the build or the check above
      # failed, main is untouched and the version is still free.
      - name: Commit and tag
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.next }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json CHANGELOG.md
          git commit -m "Release v$version"
          git tag -a "v$version" -m "v$version"
          # Atomic: the branch and the tag land together or not at all, so a
          # rejected push cannot leave a tag pointing at a commit no branch has.
          git push origin HEAD:main --follow-tags --atomic

      # The jobs below take the package from here, on fresh runners that never
      # see the deploy key above. The hash travels as a job output, which only
      # this job can set: the store job checks the ZIP against it before it
      # uploads anything.
      - name: Fingerprint the package
        id: package
        shell: pwsh
        run: |
          $zip = 'dist/bcbuddy-${{ steps.version.outputs.next }}.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item (Join-Path $env:RUNNER_TEMP 'release-notes.md') dist/
          "sha256=$hash" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "SHA-256: $hash"

      - name: Keep the package for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/bcbuddy-${{ steps.version.outputs.next }}.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # A job of its own, because softprops/action-gh-release is the one action in
  # this workflow that is not GitHub's. Here it gets the package and a token
  # that can write releases, and nothing more: not the deploy key that may push
  # to main, not the store secrets, and no hand in what the store receives.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          files: dist/bcbuddy-${{ needs.release.outputs.version }}.zip
          # The changelog section the release job dated, rather than a generated
          # list of merged pull requests. See 'Close off the changelog' above.
          body_path: dist/release-notes.md

  # After the tag, because the store refuses to take the same version twice: a
  # failure anywhere earlier costs nothing, a failure here costs this version
  # number. It runs beside the GitHub release, not after it, so neither can
  # touch what the other works with.
  store:
    needs: release
    if: inputs.store != 'none'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Package must be the one the release job built
        shell: pwsh
        env:
          EXPECTED: ${{ needs.release.outputs.sha256 }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $hash = (Get-FileHash "dist/bcbuddy-$env:VERSION.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $env:EXPECTED -or $hash -ne $env:EXPECTED) {
            throw "The package's SHA-256 is $hash, the release job built $env:EXPECTED."
          }
          Write-Host "SHA-256 matches: $hash"

      - name: Upload to the Chrome Web Store
        shell: pwsh
        env:
          STORE_ACTION: ${{ inputs.store }}
          VERSION: ${{ needs.release.outputs.version }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          foreach ($name in 'CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN', 'EXTENSION_ID') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              throw "Secret CWS_$name is not set on this repository."
            }
          }

          # Refresh tokens die after seven days while the OAuth consent screen is
          # in 'Testing'. That shows up here as an opaque invalid_grant.
          $token = (Invoke-RestMethod -Method Post -Uri 'https://oauth2.googleapis.com/token' -Body @{
            client_id     = $env:CLIENT_ID
            client_secret = $env:CLIENT_SECRET
            refresh_token = $env:REFRESH_TOKEN
            grant_type    = 'refresh_token'
          }).access_token

          $headers = @{ Authorization = "Bearer $token"; 'x-goog-api-version' = '2' }
          $zip = (Get-Item "dist/bcbuddy-$env:VERSION.zip").FullName

          $upload = Invoke-RestMethod -Method Put -Headers $headers `
            -Uri "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$env:EXTENSION_ID" `
            -InFile $zip -ContentType 'application/zip'

          Write-Host "uploadState: $($upload.uploadState)"
          if ($upload.uploadState -eq 'FAILURE') {
            throw ($upload.itemError | ForEach-Object { $_.error_detail }) -join '; '
          }

          if ($env:STORE_ACTION -ne 'publish') {
            Write-Host 'Uploaded as a draft. Submit it from the dashboard when ready.'
            exit 0
          }

          $result = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' `
            -Uri "https://www.googleapis.com/chromewebstore/v1.1/items/$env:EXTENSION_ID/publish"
          Write-Host "status: $($result.status -join ', ')"
          if ($result.statusDetail) { Write-Host ($result.statusDetail -join "`n") }

  # The website documents the extension people can actually install, so it goes
  # out with the release rather than on every push to main.
  #
  # Called rather than triggered: the tag and the GitHub release above are both
  # created with GITHUB_TOKEN, and neither would start a workflow of its own.
  #
  # If this job fails the release itself still stands — the tag is pushed by
  # then, and the GitHub release and the store upload do not wait for the site.
  # Run the Site workflow by hand from the Actions tab to publish it afterwards.
  site:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.release.outputs.tag }}
